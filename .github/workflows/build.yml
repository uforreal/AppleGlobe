                      ChatMessage(isMe: true, text: "Thanks for the heads up!")
                  ]),
                  FriendChat(name: "Nora", color: Color(red: 142/255, green: 78/255, blue: 198/255), time: "11/4", unread: false, countries: 30, messages: [
                      ChatMessage(isMe: false, text: "30 countries! My passport is full 🌍"),
                      ChatMessage(isMe: true, text: "Congrats! Where next?"),
                      ChatMessage(isMe: false, text: "Tokyo in March")
                  ]),
                  FriendChat(name: "Amine R.", color: Color(red: 15/255, green: 154/255, blue: 168/255), time: "11/2", unread: false, countries: 11, messages: [
                      ChatMessage(isMe: true, text: "See you at the airport"),
                      ChatMessage(isMe: false, text: "Terminal 2 at 6 PM. Do not be late")
                  ])
              ]

              static let replies = ["Haha nice", "Send me the details", "On my way ✈️", "Let me check the app", "Same here!"]

              static let photoPalettes: [[Color]] = [
                  [Color(red: 244/255, green: 239/255, blue: 230/255), Color(red: 203/255, green: 191/255, blue: 159/255)],
                  [Color(red: 17/255, green: 17/255, blue: 17/255), Color(red: 42/255, green: 36/255, blue: 24/255)],
                  [Color(red: 15/255, green: 26/255, blue: 46/255), Color(red: 38/255, green: 48/255, blue: 79/255)],
                  [Color(red: 91/255, green: 70/255, blue: 54/255), Color(red: 196/255, green: 154/255, blue: 108/255), Color(red: 58/255, green: 42/255, blue: 34/255)],
                  [Color(red: 1.0, green: 154/255, blue: 90/255), Color(red: 194/255, green: 69/255, blue: 107/255), Color(red: 59/255, green: 45/255, blue: 107/255)],
                  [Color(red: 27/255, green: 42/255, blue: 82/255), Color(red: 61/255, green: 90/255, blue: 158/255), Color(red: 159/255, green: 183/255, blue: 232/255)],
                  [Color.white, Color(red: 228/255, green: 228/255, blue: 234/255)],
                  [Color(red: 47/255, green: 107/255, blue: 74/255), Color(red: 143/255, green: 199/255, blue: 154/255)],
                  [Color(red: 27/255, green: 20/255, blue: 16/255), Color(red: 59/255, green: 36/255, blue: 22/255)],
                  [Color(red: 15/255, green: 154/255, blue: 168/255), Color(red: 11/255, green: 58/255, blue: 82/255)],
                  [Color(red: 217/255, green: 214/255, blue: 208/255), Color(red: 167/255, green: 159/255, blue: 146/255)],
                  [Color(red: 94/255, green: 84/255, blue: 236/255), Color(red: 26/255, green: 24/255, blue: 64/255)]
              ]

              static func galleryPalette(at index: Int) -> [Color] {
                  let idx = (index * 5 + index / 4) % photoPalettes.count
                  return photoPalettes[idx]
              }
          }

          // MARK: - 1. Custom Icons

          struct ATCTowerShape: Shape {
              func path(in rect: CGRect) -> Path {
                  let sx = rect.width / 20
                  let sy = rect.height / 24
                  func pt(_ x: CGFloat, _ y: CGFloat) -> CGPoint {
                      CGPoint(x: rect.minX + x * sx, y: rect.minY + y * sy)
                  }
                  func box(_ x: CGFloat, _ y: CGFloat, _ w: CGFloat, _ h: CGFloat) -> CGRect {
                      CGRect(x: rect.minX + x * sx, y: rect.minY + y * sy, width: w * sx, height: h * sy)
                  }

                  var path = Path()
                  path.addRect(box(9.3, 0, 1.4, 3))
                  path.addRect(box(2, 3, 16, 1.8))

                  path.move(to: pt(3, 4.8))
                  path.addLine(to: pt(17, 4.8))
                  path.addLine(to: pt(14, 11))
                  path.addLine(to: pt(6, 11))
                  path.closeSubpath()

                  path.move(to: pt(4.6, 6.3))
                  path.addLine(to: pt(15.4, 6.3))
                  path.addLine(to: pt(14.1, 9.2))
                  path.addLine(to: pt(5.9, 9.2))
                  path.closeSubpath()

                  path.addRect(box(9.4, 6.3, 1.2, 2.9))
                  path.addRect(box(8.4, 11, 3.2, 5.5))

                  path.move(to: pt(8.4, 16.5))
                  path.addLine(to: pt(11.6, 16.5))
                  path.addLine(to: pt(15, 22))
                  path.addLine(to: pt(5, 22))
                  path.closeSubpath()

                  path.addRect(box(3.5, 22, 13, 1.6))
                  return path
              }
          }

          struct FlightyATCTowerIcon: View {
              var body: some View {
                  ATCTowerShape()
                      .fill(Color.white, style: FillStyle(eoFill: true))
                      .frame(width: 17, height: 20)
              }
          }

          struct FlightyAirplaneIcon: View {
              let selected: Bool
              private var tint: Color { selected ? SampleData.brandBlue : Color(white: 0.12) }

              var body: some View {
                  ZStack {
                      Circle()
                          .fill(tint)
                          .frame(width: 24, height: 24)
                          .overlay(
                              Image(systemName: "airplane")
                                  .font(.system(size: 12.5, weight: .bold))
                                  .foregroundColor(.white)
                                  .rotationEffect(.degrees(-45))
                          )

                      ZStack {
                          Circle()
                              .fill(Color.white)
                              .frame(width: 13, height: 13)
                          Circle()
                              .fill(tint)
                              .frame(width: 10.5, height: 10.5)
                          Image(systemName: "person.fill")
                              .font(.system(size: 6))
                              .foregroundColor(.white)
                      }
                      .offset(x: 9, y: 8)
                  }
                  .frame(width: 32, height: 28)
              }
          }

          struct FlightyFriendsIcon: View {
              let selected: Bool
              private var tint: Color { selected ? SampleData.brandBlue : Color(white: 0.12) }

              var body: some View {
                  ZStack {
                      ZStack {
                          Image(systemName: "bubble.middle.bottom.fill")
                              .font(.system(size: 16))
                          Image(systemName: "person.fill")
                              .font(.system(size: 6.5))
                              .foregroundColor(Color(white: 0.94))
                              .offset(y: -1.5)
                      }
                      .offset(x: -5, y: -2)

                      ZStack {
                          Image(systemName: "bubble.middle.bottom.fill")
                              .font(.system(size: 18))
                          Image(systemName: "person.fill")
                              .font(.system(size: 7.5))
                              .foregroundColor(Color(white: 0.94))
                              .offset(y: -2)
                      }
                      .offset(x: 5, y: 2)
                  }
                  .foregroundColor(tint)
                  .frame(width: 32, height: 28)
              }
          }

          struct FlightyPassportIcon: View {
              let selected: Bool
              private var tint: Color { selected ? SampleData.brandBlue : Color(white: 0.12) }

              var body: some View {
                  ZStack {
                      RoundedRectangle(cornerRadius: 3.5)
                          .fill(tint)
                          .frame(width: 18, height: 24)

                      Rectangle()
                          .fill(Color.white.opacity(0.2))
                          .frame(width: 1, height: 24)
                          .offset(x: -7)

                      VStack(spacing: 2.5) {
                          Image(systemName: "globe.americas.fill")
                              .font(.system(size: 8))
                              .foregroundColor(.white.opacity(0.9))

                          RoundedRectangle(cornerRadius: 0.5)
                              .fill(Color.white.opacity(0.8))
                              .frame(width: 7, height: 1.2)
                      }
                  }
                  .frame(width: 32, height: 28)
              }
          }

          struct FlightyTab<Icon: View>: View {
              let title: String
              let selected: Bool
              let action: () -> Void
              let icon: Icon

              init(title: String, selected: Bool, action: @escaping () -> Void, @ViewBuilder icon: () -> Icon) {
                  self.title = title
                  self.selected = selected
                  self.action = action
                  self.icon = icon()
              }

              var body: some View {
                  Button(action: action) {
                      VStack(spacing: 1) {
                          icon
                          Text(title)
                              .font(.system(size: 10, weight: selected ? .bold : .semibold))
                              .foregroundColor(selected ? SampleData.brandBlue : Color(white: 0.12))
                      }
                      .frame(maxWidth: .infinity, maxHeight: .infinity)
                      .background {
                          if selected {
                              Capsule().fill(Color.black.opacity(0.07))
                          }
                      }
                  }
                  .buttonStyle(.plain)
              }
          }

          struct FlightyAvatar: View {
              var body: some View {
                  ZStack {
                      Circle()
                          .fill(
                              LinearGradient(
                                  colors: [Color(white: 0.80), Color(white: 0.62)],
                                  startPoint: .top,
                                  endPoint: .bottom
                              )
                          )
                      Image(systemName: "person.fill")
                          .font(.system(size: 22))
                          .foregroundColor(.white)
                          .offset(y: 5)
                  }
                  .frame(width: 38, height: 38)
                  .clipShape(Circle())
                  .frame(width: 44, height: 44)
                  .flightyGlass(in: Circle(), fallback: Color.white)
              }
          }

          // MARK: - 2. Map Style Pop-up

          struct MapStyleMenu: View {
              @Binding var mapStyle: MapStyleKind
              @Binding var selectedLayers: Set<MapLayerKind>
              let onClose: () -> Void

              var body: some View {
                  VStack(spacing: 0) {
                      HStack(spacing: 18) {
                          styleCard(kind: .standard, label: "Standard", colors: [Color(red: 21/255, green: 23/255, blue: 31/255), Color(red: 35/255, green: 35/255, blue: 56/255)])
                          styleCard(kind: .satellite, label: "Satellite", colors: [Color(red: 15/255, green: 42/255, blue: 61/255), Color(red: 28/255, green: 74/255, blue: 82/255)])
                      }
                      .padding(.horizontal, 14)
                      .padding(.bottom, 12)

                      Divider().padding(.horizontal, 18)

                      ForEach(MapLayerKind.allCases) { layer in
                          let on = selectedLayers.contains(layer)
                          Button(action: {
                              if on { selectedLayers.remove(layer) } else { selectedLayers.insert(layer) }
                              DispatchQueue.main.asyncAfter(deadline: .now() + 0.18) { onClose() }
                          }) {
                              HStack(spacing: 10) {
                                  Image(systemName: "checkmark")
                                      .font(.system(size: 13, weight: .bold))
                                      .opacity(on ? 1 : 0)
                                      .frame(width: 14)
                                  Image(systemName: iconName(for: layer))
                                      .font(.system(size: 16, weight: .medium))
                                      .frame(width: 22)
                                  Text(layer.rawValue)
                                      .font(.system(size: 16))
                                  Spacer()
                              }
                              .foregroundColor(.black)
                              .padding(.horizontal, 16)
                              .padding(.vertical, 10)
                          }
                          .buttonStyle(.plain)
                      }

                      Divider().padding(.horizontal, 18)

                      Button(action: {
                          DispatchQueue.main.asyncAfter(deadline: .now() + 0.18) { onClose() }
                      }) {
                          HStack {
                              Text("Manage layers")
                                  .font(.system(size: 16))
                                  .foregroundColor(.black)
                              Spacer()
                          }
                          .padding(.horizontal, 20)
                          .padding(.vertical, 10)
                      }
                      .buttonStyle(.plain)
                  }
                  .padding(.top, 16)
                  .padding(.bottom, 6)
                  .frame(width: 236)
                  .background(.ultraThinMaterial, in: RoundedRectangle(cornerRadius: 34, style: .continuous))
                  .background(Color(white: 0.98).opacity(0.85), in: RoundedRectangle(cornerRadius: 34, style: .continuous))
                  .shadow(color: .black.opacity(0.35), radius: 22, y: 10)
                  .environment(\.colorScheme, .light)
              }

              private func iconName(for layer: MapLayerKind) -> String {
                  switch layer {
                  case .flights: return "airplane"
                  case .delays: return "calendar.badge.clock"
                  case .friends: return "person.2"
                  }
              }

              @ViewBuilder
              private func styleCard(kind: MapStyleKind, label: String, colors: [Color]) -> some View {
                  let selected = mapStyle == kind
                  Button(action: {
                      mapStyle = kind
                      DispatchQueue.main.asyncAfter(deadline: .now() + 0.18) { onClose() }
                  }) {
                      VStack(spacing: 8) {
                          ZStack(alignment: .top) {
                              LinearGradient(colors: colors, startPoint: .top, endPoint: .bottom)
                                  .frame(width: 54, height: 94)
                                  .clipShape(RoundedRectangle(cornerRadius: 13, style: .continuous))
                                  .overlay(
                                      RoundedRectangle(cornerRadius: 13, style: .continuous)
                                          .stroke(selected ? SampleData.brandBlue : Color(white: 0.42), lineWidth: 3)
                                  )
                              Capsule()
                                  .fill(Color.black.opacity(0.55))
                                  .frame(width: 16, height: 5)
                                  .padding(.top, 4)
                          }

                          Text(label)
                              .font(.system(size: 13, weight: .medium))
                              .foregroundColor(.black)

                          ZStack {
                              Circle()
                                  .fill(selected ? SampleData.brandBlue : Color.clear)
                                  .frame(width: 26, height: 26)
                                  .overlay(
                                      Circle().stroke(selected ? SampleData.brandBlue : Color(white: 0.42), lineWidth: 2)
                                  )
                              if selected {
                                  Image(systemName: "checkmark")
                                      .font(.system(size: 12, weight: .bold))
                                      .foregroundColor(.white)
                              }
                          }
                      }
                  }
                  .buttonStyle(.plain)
              }
          }

          // MARK: - 3. World Feed & Friends List

          struct PostRowView: View {
              @Binding var post: FeedPost

              var body: some View {
                  HStack(alignment: .top, spacing: 10) {
                      Circle()
                          .fill(post.color)
                          .frame(width: 36, height: 36)
                          .overlay(
                              Text(String(post.name.prefix(1)))
                                  .font(.system(size: 15, weight: .semibold))
                                  .foregroundColor(.white)
                          )

                      VStack(alignment: .leading, spacing: 4) {
                          HStack(spacing: 5) {
                              Text(post.name)
                                  .font(.system(size: 14, weight: .bold))
                                  .foregroundColor(Color(red: 15/255, green: 20/255, blue: 25/255))
                                  .lineLimit(1)
                              Text("\(post.handle) · \(post.time)")
                                  .font(.system(size: 14))
                                  .foregroundColor(Color(red: 139/255, green: 141/255, blue: 147/255))
                                  .lineLimit(1)
                              Spacer()
                          }

                          Text(post.text)
                              .font(.system(size: 14))
                              .lineSpacing(2)
                              .foregroundColor(Color(red: 15/255, green: 20/255, blue: 25/255))

                          if let gradient = post.gradient {
                              RoundedRectangle(cornerRadius: 14, style: .continuous)
                                  .fill(LinearGradient(colors: gradient, startPoint: .topLeading, endPoint: .bottomTrailing))
                                  .frame(height: 118)
                                  .padding(.top, 4)
                          }

                          HStack {
                              actionLabel(icon: "bubble.left", value: post.replies)
                              Spacer()
                              actionLabel(icon: "arrow.2.squarepath", value: post.reposts)
                              Spacer()
                              Button(action: toggleLike) {
                                  HStack(spacing: 4) {
                                      Image(systemName: post.isLiked ? "heart.fill" : "heart")
                                          .font(.system(size: 14))
                                      Text(displayedLikes)
                                          .font(.system(size: 12))
                                  }
                                  .foregroundColor(post.isLiked ? Color(red: 249/255, green: 24/255, blue: 128/255) : Color(red: 107/255, green: 112/255, blue: 120/255))
                              }
                              .buttonStyle(.plain)
                              Spacer()
                              actionLabel(icon: "square.and.arrow.up", value: "")
                          }
                          .frame(maxWidth: 270)
                          .padding(.top, 4)
                      }
                  }
                  .padding(.vertical, 10)
              }

              private var displayedLikes: String {
                  if let base = post.numericLikes {
                      return String(base + (post.isLiked ? 1 : 0))
                  }
                  return post.likesText
              }

              private func toggleLike() {
                  post.isLiked.toggle()
              }

              @ViewBuilder
              private func actionLabel(icon: String, value: String) -> some View {
                  HStack(spacing: 4) {
                      Image(systemName: icon).font(.system(size: 14))
                      if !value.isEmpty { Text(value).font(.system(size: 12)) }
                  }
                  .foregroundColor(Color(red: 107/255, green: 112/255, blue: 120/255))
              }
          }


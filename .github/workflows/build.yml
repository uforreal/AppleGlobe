name: Build Globe IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Create Swift App Code
        run: |
          cat << 'EOF' > App.swift
          import SwiftUI
          import MapKit

          // MARK: - 1. Custom Air Traffic Control Tower Icon
          struct FlightyATCTowerIcon: View {
              var body: some View {
                  ZStack {
                      // Spire
                      Path { p in
                          p.move(to: CGPoint(x: 9, y: 0.5))
                          p.addLine(to: CGPoint(x: 9, y: 3))
                      }
                      .stroke(Color.white, lineWidth: 1.6)

                      // Tower Silhouette
                      Path { p in
                          // Roof slab
                          p.move(to: CGPoint(x: 4.5, y: 3))
                          p.addLine(to: CGPoint(x: 13.5, y: 3))
                          // Cab upper angle
                          p.addLine(to: CGPoint(x: 15.5, y: 6.5))
                          // Cab lower taper
                          p.addLine(to: CGPoint(x: 12.5, y: 10.5))
                          // Shaft right
                          p.addLine(to: CGPoint(x: 11.2, y: 16))
                          // Base flare
                          p.addLine(to: CGPoint(x: 14.5, y: 19))
                          p.addLine(to: CGPoint(x: 3.5, y: 19))
                          // Base left flare
                          p.addLine(to: CGPoint(x: 6.8, y: 16))
                          // Shaft left
                          p.addLine(to: CGPoint(x: 5.5, y: 10.5))
                          // Cab lower left
                          p.addLine(to: CGPoint(x: 2.5, y: 6.5))
                          p.closeSubpath()
                      }
                      .fill(Color.white)

                      // Window band cutout
                      Path { p in
                          p.move(to: CGPoint(x: 4.6, y: 6.5))
                          p.addLine(to: CGPoint(x: 13.4, y: 6.5))
                          p.addLine(to: CGPoint(x: 12.0, y: 8.8))
                          p.addLine(to: CGPoint(x: 6.0, y: 8.8))
                          p.closeSubpath()
                      }
                      .fill(Color(red: 0.10, green: 0.14, blue: 0.20))

                      // Vertical window divider
                      Rectangle()
                          .fill(Color.white)
                          .frame(width: 1.2, height: 2.3)
                          .offset(y: -2.3)
                  }
                  .frame(width: 18, height: 21)
              }
          }

          // MARK: - 2. Custom Dock Icons
          struct FlightyAirplaneIcon: View {
              var body: some View {
                  ZStack {
                      Circle()
                          .fill(Color(red: 0.05, green: 0.47, blue: 0.99))
                          .frame(width: 25, height: 25)
                          .overlay(
                              Image(systemName: "airplane")
                                  .font(.system(size: 13, weight: .bold))
                                  .foregroundColor(.white)
                                  .rotationEffect(.degrees(-45))
                          )
                      
                      ZStack {
                          Circle()
                              .fill(Color.white)
                              .frame(width: 13, height: 13)
                          Circle()
                              .fill(Color(red: 0.05, green: 0.47, blue: 0.99))
                              .frame(width: 10.5, height: 10.5)
                          Image(systemName: "person.fill")
                              .font(.system(size: 6))
                              .foregroundColor(.white)
                      }
                      .offset(x: 9, y: 8)
                  }
                  .frame(width: 32, height: 28)
              }
          }

          struct FlightyFriendsIcon: View {
              var body: some View {
                  ZStack {
                      ZStack {
                          Image(systemName: "bubble.middle.bottom.fill")
                              .font(.system(size: 15))
                          Image(systemName: "person.fill")
                              .font(.system(size: 6))
                              .foregroundColor(Color(red: 0.93, green: 0.94, blue: 0.95))
                              .offset(y: -1.5)
                      }
                      .offset(x: -5, y: -2)

                      ZStack {
                          Image(systemName: "bubble.middle.bottom.fill")
                              .font(.system(size: 17))
                          Image(systemName: "person.fill")
                              .font(.system(size: 7))
                              .foregroundColor(Color(red: 0.93, green: 0.94, blue: 0.95))
                              .offset(y: -2)
                      }
                      .offset(x: 5, y: 2)
                  }
                  .foregroundColor(Color(red: 0.15, green: 0.15, blue: 0.16))
                  .frame(width: 32, height: 28)
              }
          }

          struct FlightyPassportIcon: View {
              var body: some View {
                  ZStack {
                      RoundedRectangle(cornerRadius: 3.5)
                          .fill(Color(red: 0.15, green: 0.15, blue: 0.16))
                          .frame(width: 18, height: 24)
                      
                      Rectangle()
                          .fill(Color.white.opacity(0.2))
                          .frame(width: 1, height: 24)
                          .offset(x: -7)

                      VStack(spacing: 2.5) {
                          Image(systemName: "globe.americas.fill")
                              .font(.system(size: 8))
                              .foregroundColor(.white.opacity(0.9))
                          
                          RoundedRectangle(cornerRadius: 0.5)
                              .fill(Color.white.opacity(0.8))
                              .frame(width: 7, height: 1.2)
                      }
                  }
                  .frame(width: 32, height: 28)
              }
          }

          // MARK: - 3. Bottom Sheet View
          struct FlightySheetView: View {
              var body: some View {
                  VStack(spacing: 0) {
                      // Top Row: Title + Profile/Share Actions
                      HStack(alignment: .center) {
                          Text("My Flights")
                              .font(.system(size: 32, weight: .bold))
                              .foregroundColor(.black)
                          
                          Spacer()
                          
                          HStack(spacing: 8) {
                              Button(action: {}) {
                                  Image(systemName: "square.and.arrow.up")
                                      .font(.system(size: 15, weight: .semibold))
                                      .foregroundColor(.black)
                                      .frame(width: 40, height: 40)
                                      .background(Color(red: 0.94, green: 0.94, blue: 0.96))
                                      .clipShape(Circle())
                              }
                              
                              Button(action: {}) {
                                  ZStack {
                                      Circle()
                                          .fill(Color(red: 0.82, green: 0.82, blue: 0.85))
                                          .frame(width: 34, height: 34)
                                      Image(systemName: "person.fill")
                                          .font(.system(size: 18))
                                          .foregroundColor(.white)
                                          .offset(y: 3)
                                  }
                                  .frame(width: 40, height: 40)
                                  .background(Color(red: 0.94, green: 0.94, blue: 0.96))
                                  .clipShape(Circle())
                              }
                          }
                      }
                      .padding(.horizontal, 20)
                      .padding(.top, 16)

                      Spacer()

                      // Middle: Sync Status
                      VStack(spacing: 4) {
                          Text("Syncing...")
                              .font(.system(size: 15, weight: .semibold))
                              .foregroundColor(Color(red: 0.45, green: 0.46, blue: 0.48))
                          Text("Restoring your flights")
                              .font(.system(size: 13))
                              .foregroundColor(Color(red: 0.58, green: 0.59, blue: 0.61))
                      }

                      Spacer()

                      // Bottom Dock
                      HStack(spacing: 10) {
                          HStack(spacing: 0) {
                              // Tab 1: My Flights
                              VStack(spacing: 2) {
                                  FlightyAirplaneIcon()
                                  Text("My Flights")
                                      .font(.system(size: 10, weight: .bold))
                                      .foregroundColor(Color(red: 0.05, green: 0.47, blue: 0.99))
                              }
                              .frame(maxWidth: .infinity, maxHeight: .infinity)
                              .background(Color.white)
                              .clipShape(Capsule())
                              .shadow(color: .black.opacity(0.04), radius: 2, y: 1)
                              .padding(4)

                              // Tab 2: Friends
                              VStack(spacing: 2) {
                                  FlightyFriendsIcon()
                                  Text("Friends")
                                      .font(.system(size: 10, weight: .semibold))
                                      .foregroundColor(Color(red: 0.25, green: 0.26, blue: 0.28))
                              }
                              .frame(maxWidth: .infinity)

                              // Tab 3: Passport
                              VStack(spacing: 2) {
                                  FlightyPassportIcon()
                                  Text("Passport")
                                      .font(.system(size: 10, weight: .semibold))
                                      .foregroundColor(Color(red: 0.25, green: 0.26, blue: 0.28))
                              }
                              .frame(maxWidth: .infinity)
                          }
                          .frame(height: 56)
                          .background(Color(red: 0.94, green: 0.94, blue: 0.96))
                          .clipShape(Capsule())

                          // Global Search Button
                          Button(action: {}) {
                              Image(systemName: "magnifyingglass")
                                  .font(.system(size: 19, weight: .bold))
                                  .foregroundColor(.black)
                                  .frame(width: 56, height: 56)
                                  .background(Color(red: 0.94, green: 0.94, blue: 0.96))
                                  .clipShape(Circle())
                          }
                      }
                      .padding(.horizontal, 16)
                      .padding(.bottom, 14)
                  }
                  .frame(maxWidth: .infinity, maxHeight: .infinity)
                  .background(Color.white)
                  .ignoresSafeArea(edges: .bottom)
              }
          }

          // MARK: - 4. Main App Entry
          @main
          struct GlobeApp: App {
              @State private var showSheet = true
              @State private var sheetDetent: PresentationDetent = .fraction(0.34)

              var body: some Scene {
                  WindowGroup {
                      ZStack(alignment: .topTrailing) {
                          Map()
                              .mapStyle(.hybrid(elevation: .realistic))
                              .ignoresSafeArea()

                          // Top-Right Floating Controls (Flighty Replica)
                          VStack(spacing: 8) {
                              // Element 1: 2-Button Pill (Map & Outlined Cloud)
                              VStack(spacing: 2) {
                                  Button(action: {}) {
                                      Image(systemName: "map.fill")
                                          .font(.system(size: 18, weight: .medium))
                                          .foregroundColor(.white)
                                          .frame(width: 45, height: 40)
                                  }
                                  Button(action: {}) {
                                      Image(systemName: "cloud")
                                          .font(.system(size: 17, weight: .medium))
                                          .foregroundColor(.white)
                                          .frame(width: 45, height: 40)
                                  }
                              }
                              .padding(.vertical, 4)
                              .background(Color(red: 0.10, green: 0.14, blue: 0.20).opacity(0.85))
                              .clipShape(Capsule())
                              .shadow(color: .black.opacity(0.3), radius: 6, y: 2)

                              // Element 2: Standalone Circular ATC Tower Button
                              Button(action: {}) {
                                  FlightyATCTowerIcon()
                                      .frame(width: 45, height: 45)
                                      .background(Color(red: 0.10, green: 0.14, blue: 0.20).opacity(0.85))
                                      .clipShape(Circle())
                                      .shadow(color: .black.opacity(0.3), radius: 6, y: 2)
                              }
                          }
                          // Exact Flighty alignment: 28pt from top, 11pt from right edge
                          .padding(.top, 28)
                          .padding(.trailing, 11)
                      }
                      .sheet(isPresented: $showSheet) {
                          FlightySheetView()
                              .presentationDetents(
                                  [.fraction(0.34), .fraction(0.61), .large],
                                  selection: $sheetDetent
                              )
                              .interactiveDismissDisabled(true)
                              .presentationDragIndicator(.hidden)
                              .presentationBackgroundInteraction(.enabled(upThrough: .fraction(0.61)))
                              .presentationCornerRadius(32)
                      }
                  }
              }
          }
          EOF

      - name: Create Info.plist
        run: |
          cat << 'EOF' > Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>GlobeApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.custom.globe</string>
              <key>CFBundleName</key>
              <string>Flighty</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>17.0</string>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Compile App Binary
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc -sdk "$SDK_PATH" -target arm64-apple-ios17.0 -parse-as-library -framework SwiftUI -framework MapKit -framework UIKit App.swift -o GlobeApp

      - name: Package into IPA
        run: |
          mkdir -p Payload/GlobeApp.app
          cp GlobeApp Payload/GlobeApp.app/
          cp Info.plist Payload/GlobeApp.app/
          zip -r Globe.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Globe-IPA
          path: Globe.ipa

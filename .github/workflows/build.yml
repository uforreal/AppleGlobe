name: Build Globe IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Create Swift App Code
        run: |
          cat << 'EOF' > App.swift
          import SwiftUI
          import MapKit

          struct FlightySheetView: View {
              var body: some View {
                  VStack(spacing: 0) {
                      // 1. Header: Title + Share & Profile Buttons
                      HStack(alignment: .center) {
                          Text("My Flights")
                              .font(.system(size: 32, weight: .bold))
                              .foregroundColor(.black)
                          
                          Spacer()
                          
                          HStack(spacing: 10) {
                              Button(action: {}) {
                                  Image(systemName: "square.and.arrow.up")
                                      .font(.system(size: 16, weight: .semibold))
                                      .foregroundColor(.black)
                                      .frame(width: 40, height: 40)
                                      .background(Color(white: 0.94))
                                      .clipShape(Circle())
                              }
                              
                              Button(action: {}) {
                                  Image(systemName: "person.crop.circle.fill")
                                      .font(.system(size: 30))
                                      .foregroundColor(.gray.opacity(0.55))
                                      .frame(width: 40, height: 40)
                                      .background(Color(white: 0.94))
                                      .clipShape(Circle())
                              }
                          }
                      }
                      .padding(.horizontal, 20)
                      .padding(.top, 16)

                      Spacer(minLength: 12)

                      // 2. Centered Syncing Status
                      VStack(spacing: 4) {
                          Text("Syncing...")
                              .font(.system(size: 15, weight: .semibold))
                              .foregroundColor(.secondary)
                          Text("Restoring your flights")
                              .font(.system(size: 13))
                              .foregroundColor(.secondary.opacity(0.8))
                      }

                      Spacer(minLength: 16)

                      // 3. Adjusted Dock (Slimmer 56pt height, pinned to bottom)
                      HStack(spacing: 10) {
                          // Tab Capsule
                          HStack(spacing: 0) {
                              // Tab 1: My Flights (Active Pill)
                              VStack(spacing: 2) {
                                  Image(systemName: "airplane.circle.fill")
                                      .font(.system(size: 19))
                                  Text("My Flights")
                                      .font(.system(size: 10.5, weight: .bold))
                              }
                              .foregroundColor(.blue)
                              .frame(maxWidth: .infinity, maxHeight: .infinity)
                              .background(Color.white)
                              .clipShape(Capsule())
                              .shadow(color: .black.opacity(0.05), radius: 3, y: 1)
                              .padding(3)

                              // Tab 2: Friends
                              VStack(spacing: 2) {
                                  Image(systemName: "person.2.fill")
                                      .font(.system(size: 16))
                                  Text("Friends")
                                      .font(.system(size: 10.5, weight: .semibold))
                              }
                              .foregroundColor(.black.opacity(0.7))
                              .frame(maxWidth: .infinity)

                              // Tab 3: Passport
                              VStack(spacing: 2) {
                                  Image(systemName: "text.book.closed.fill")
                                      .font(.system(size: 16))
                                  Text("Passport")
                                      .font(.system(size: 10.5, weight: .semibold))
                              }
                              .foregroundColor(.black.opacity(0.7))
                              .frame(maxWidth: .infinity)
                          }
                          .frame(height: 56)
                          .background(Color(white: 0.94))
                          .clipShape(Capsule())

                          // Search Button (Aligned 56x56 circle)
                          Button(action: {}) {
                              Image(systemName: "magnifyingglass")
                                  .font(.system(size: 18, weight: .bold))
                                  .foregroundColor(.black)
                                  .frame(width: 56, height: 56)
                                  .background(Color(white: 0.94))
                                  .clipShape(Circle())
                          }
                      }
                      .padding(.horizontal, 16)
                      .padding(.bottom, 8) // Pinned tightly to the bottom
                  }
                  .frame(maxWidth: .infinity, maxHeight: .infinity)
                  .background(Color.white)
              }
          }

          @main
          struct GlobeApp: App {
              @State private var showSheet = true

              var body: some Scene {
                  WindowGroup {
                      ZStack(alignment: .topTrailing) {
                          // Hybrid 3D Globe
                          Map()
                              .mapStyle(.hybrid(elevation: .realistic))
                              .ignoresSafeArea()

                          // Floating Map Tools (2 sections separated by divider like Flighty)
                          VStack(spacing: 0) {
                              Button(action: {}) {
                                  Image(systemName: "map.fill")
                                      .font(.system(size: 17))
                                      .foregroundColor(.white)
                                      .frame(width: 44, height: 40)
                              }
                              Button(action: {}) {
                                  Image(systemName: "cloud.fill")
                                      .font(.system(size: 17))
                                      .foregroundColor(.white)
                                      .frame(width: 44, height: 40)
                              }
                              Divider()
                                  .background(Color.white.opacity(0.3))
                                  .frame(width: 26)
                                  .padding(.vertical, 4)
                              Button(action: {}) {
                                  Image(systemName: "antenna.radiowaves.left.and.right")
                                      .font(.system(size: 17))
                                      .foregroundColor(.white)
                                      .frame(width: 44, height: 40)
                              }
                          }
                          .padding(.vertical, 6)
                          .background(.ultraThinMaterial)
                          .clipShape(Capsule())
                          .shadow(color: .black.opacity(0.25), radius: 8)
                          .padding(.top, 56)
                          .padding(.trailing, 16)
                      }
                      // Reduced height to 0.32 so it leaves the gap below ARGELIA
                      .sheet(isPresented: $showSheet) {
                          FlightySheetView()
                              .presentationDetents([.fraction(0.32), .fraction(0.88)])
                              .presentationDragIndicator(.hidden)
                              .presentationBackgroundInteraction(.enabled(upThrough: .fraction(0.32)))
                              .presentationCornerRadius(32)
                      }
                  }
              }
          }
          EOF

      - name: Create Info.plist
        run: |
          cat << 'EOF' > Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>GlobeApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.custom.globe</string>
              <key>CFBundleName</key>
              <string>Flighty</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>17.0</string>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Compile App Binary
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc -sdk "$SDK_PATH" -target arm64-apple-ios17.0 -parse-as-library -framework SwiftUI -framework MapKit -framework UIKit App.swift -o GlobeApp

      - name: Package into IPA
        run: |
          mkdir -p Payload/GlobeApp.app
          cp GlobeApp Payload/GlobeApp.app/
          cp Info.plist Payload/GlobeApp.app/
          zip -r Globe.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Globe-IPA
          path: Globe.ipa

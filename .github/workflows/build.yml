name: Build Globe IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Create Swift App Code
        run: |
          cat << 'EOF' > App.swift
          import SwiftUI
          import MapKit

          // MARK: - Custom Flighty Dock Icons
          struct FlightyAirplaneIcon: View {
              var body: some View {
                  ZStack {
                      Circle()
                          .fill(Color(red: 0.05, green: 0.45, blue: 0.98))
                          .frame(width: 21, height: 21)
                      Image(systemName: "airplane")
                          .font(.system(size: 11, weight: .bold))
                          .foregroundColor(.white)
                          .offset(x: -2, y: -2)
                      Image(systemName: "person.fill")
                          .font(.system(size: 6.5))
                          .foregroundColor(.white)
                          .offset(x: 4.5, y: 4.5)
                  }
                  .frame(height: 22)
              }
          }

          struct FlightyFriendsIcon: View {
              var body: some View {
                  ZStack {
                      // Left chat bubble with avatar
                      ZStack {
                          Image(systemName: "bubble.left.fill")
                              .font(.system(size: 13))
                          Image(systemName: "person.fill")
                              .font(.system(size: 5.5))
                              .foregroundColor(Color(red: 0.93, green: 0.94, blue: 0.95))
                              .offset(x: -1, y: -2)
                      }
                      .offset(x: -4.5, y: -1.5)

                      // Right chat bubble with avatar
                      ZStack {
                          Image(systemName: "bubble.right.fill")
                              .font(.system(size: 11.5))
                          Image(systemName: "person.fill")
                              .font(.system(size: 4.5))
                              .foregroundColor(Color(red: 0.93, green: 0.94, blue: 0.95))
                              .offset(x: 1, y: -1)
                      }
                      .offset(x: 4.5, y: 2.5)
                  }
                  .foregroundColor(Color(red: 0.22, green: 0.23, blue: 0.25))
                  .frame(height: 22)
              }
          }

          struct FlightyPassportIcon: View {
              var body: some View {
                  ZStack {
                      RoundedRectangle(cornerRadius: 2.5)
                          .fill(Color(red: 0.22, green: 0.23, blue: 0.25))
                          .frame(width: 15, height: 20)
                      
                      VStack(spacing: 2) {
                          Image(systemName: "globe.americas.fill")
                              .font(.system(size: 6.5))
                              .foregroundColor(.white.opacity(0.85))
                          
                          VStack(spacing: 1) {
                              RoundedRectangle(cornerRadius: 0.5)
                                  .fill(Color.white.opacity(0.75))
                                  .frame(width: 7, height: 1)
                              RoundedRectangle(cornerRadius: 0.5)
                                  .fill(Color.white.opacity(0.75))
                                  .frame(width: 4.5, height: 1)
                          }
                      }
                  }
                  .frame(height: 22)
              }
          }

          // MARK: - Flighty Sheet View
          struct FlightySheetView: View {
              var body: some View {
                  VStack(spacing: 0) {
                      // Top Row: Title + Profile/Share Actions
                      HStack(alignment: .center) {
                          Text("My Flights")
                              .font(.system(size: 32, weight: .bold))
                              .foregroundColor(.black)
                          
                          Spacer()
                          
                          HStack(spacing: 8) {
                              Button(action: {}) {
                                  Image(systemName: "square.and.arrow.up")
                                      .font(.system(size: 15, weight: .semibold))
                                      .foregroundColor(.black)
                                      .frame(width: 38, height: 38)
                                      .background(Color(red: 0.93, green: 0.94, blue: 0.95))
                                      .clipShape(Circle())
                              }
                              
                              Button(action: {}) {
                                  Image(systemName: "person.crop.circle.fill")
                                      .font(.system(size: 28))
                                      .foregroundColor(.gray.opacity(0.5))
                                      .frame(width: 38, height: 38)
                                      .background(Color(red: 0.93, green: 0.94, blue: 0.95))
                                      .clipShape(Circle())
                              }
                          }
                      }
                      .padding(.horizontal, 20)
                      .padding(.top, 16)

                      Spacer()

                      // Middle: Sync Status
                      VStack(spacing: 4) {
                          Text("Syncing...")
                              .font(.system(size: 15, weight: .semibold))
                              .foregroundColor(Color(red: 0.45, green: 0.46, blue: 0.48))
                          Text("Restoring your flights")
                              .font(.system(size: 13))
                              .foregroundColor(Color(red: 0.58, green: 0.59, blue: 0.61))
                      }

                      Spacer()

                      // Bottom Anchored Flighty Dock
                      HStack(spacing: 8) {
                          // Segmented Navigation Pill
                          HStack(spacing: 0) {
                              // Tab 1: My Flights (Active)
                              VStack(spacing: 3) {
                                  FlightyAirplaneIcon()
                                  Text("My Flights")
                                      .font(.system(size: 9.5, weight: .semibold))
                                      .foregroundColor(Color(red: 0.05, green: 0.45, blue: 0.98))
                              }
                              .frame(maxWidth: .infinity, maxHeight: .infinity)
                              .background(Color(red: 0.91, green: 0.94, blue: 0.99)) // Soft tint
                              .clipShape(Capsule())
                              .padding(3)

                              // Tab 2: Friends
                              VStack(spacing: 3) {
                                  FlightyFriendsIcon()
                                  Text("Friends")
                                      .font(.system(size: 9.5, weight: .medium))
                                      .foregroundColor(Color(red: 0.35, green: 0.36, blue: 0.38))
                              }
                              .frame(maxWidth: .infinity)

                              // Tab 3: Passport
                              VStack(spacing: 3) {
                                  FlightyPassportIcon()
                                  Text("Passport")
                                      .font(.system(size: 9.5, weight: .medium))
                                      .foregroundColor(Color(red: 0.35, green: 0.36, blue: 0.38))
                              }
                              .frame(maxWidth: .infinity)
                          }
                          .frame(height: 52)
                          .background(Color(red: 0.93, green: 0.94, blue: 0.95))
                          .clipShape(Capsule())

                          // Global Search Circular Button
                          Button(action: {}) {
                              Image(systemName: "magnifyingglass")
                                  .font(.system(size: 18, weight: .bold))
                                  .foregroundColor(.black)
                                  .frame(width: 52, height: 52)
                                  .background(Color(red: 0.93, green: 0.94, blue: 0.95))
                                  .clipShape(Circle())
                          }
                      }
                      .padding(.horizontal, 16)
                      .padding(.bottom, 8)
                  }
                  .frame(maxWidth: .infinity, maxHeight: .infinity)
                  .background(Color.white)
              }
          }

          // MARK: - Main App Entry
          @main
          struct GlobeApp: App {
              @State private var showSheet = true

              var body: some Scene {
                  WindowGroup {
                      ZStack(alignment: .topTrailing) {
                          Map()
                              .mapStyle(.hybrid(elevation: .realistic))
                              .ignoresSafeArea()

                          // Top-Right Floating Controls (Layers / Weather / ATC)
                          VStack(spacing: 0) {
                              Button(action: {}) {
                                  Image(systemName: "map.fill")
                                      .font(.system(size: 16))
                                      .foregroundColor(.white)
                                      .frame(width: 44, height: 38)
                              }
                              Button(action: {}) {
                                  Image(systemName: "cloud.fill")
                                      .font(.system(size: 16))
                                      .foregroundColor(.white)
                                      .frame(width: 44, height: 38)
                              }
                              Divider()
                                  .background(Color.white.opacity(0.35))
                                  .frame(width: 26)
                                  .padding(.vertical, 3)
                              Button(action: {}) {
                                  Image(systemName: "antenna.radiowaves.left.and.right")
                                      .font(.system(size: 16))
                                      .foregroundColor(.white)
                                      .frame(width: 44, height: 38)
                              }
                          }
                          .padding(.vertical, 6)
                          .background(.ultraThinMaterial)
                          .clipShape(Capsule())
                          .shadow(color: .black.opacity(0.25), radius: 8)
                          .padding(.top, 56)
                          .padding(.trailing, 16)
                      }
                      .sheet(isPresented: $showSheet) {
                          FlightySheetView()
                              .presentationDetents([.fraction(0.32), .fraction(0.88)])
                              .presentationDragIndicator(.hidden)
                              .presentationBackgroundInteraction(.enabled(upThrough: .fraction(0.32)))
                              .presentationCornerRadius(32)
                      }
                  }
              }
          }
          EOF

      - name: Create Info.plist
        run: |
          cat << 'EOF' > Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>GlobeApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.custom.globe</string>
              <key>CFBundleName</key>
              <string>Flighty</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>17.0</string>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Compile App Binary
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc -sdk "$SDK_PATH" -target arm64-apple-ios17.0 -parse-as-library -framework SwiftUI -framework MapKit -framework UIKit App.swift -o GlobeApp

      - name: Package into IPA
        run: |
          mkdir -p Payload/GlobeApp.app
          cp GlobeApp Payload/GlobeApp.app/
          cp Info.plist Payload/GlobeApp.app/
          zip -r Globe.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Globe-IPA
          path: Globe.ipa

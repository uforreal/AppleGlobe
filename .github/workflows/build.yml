          final class CameraController: NSObject, ObservableObject, AVCapturePhotoCaptureDelegate {
              @Published var isAuthorized = false
              @Published var isUsingFront = false
              @Published var flashOn = false
              let session = AVCaptureSession()
              private let photoOutput = AVCapturePhotoOutput()
              private let queue = DispatchQueue(label: "globe.camera.session")
              private var photoCompletion: ((UIImage?) -> Void)?

              func start() {
                  let status = AVCaptureDevice.authorizationStatus(for: .video)
                  switch status {
                  case .authorized:
                      DispatchQueue.main.async { self.isAuthorized = true }
                      configureSession()
                  case .notDetermined:
                      AVCaptureDevice.requestAccess(for: .video) { granted in
                          DispatchQueue.main.async { self.isAuthorized = granted }
                          if granted { self.configureSession() }
                      }
                  default:
                      DispatchQueue.main.async { self.isAuthorized = false }
                  }
              }

              private func configureSession() {
                  queue.async {
                      self.session.beginConfiguration()
                      self.session.inputs.forEach { self.session.removeInput($0) }

                      let pos: AVCaptureDevice.Position = self.isUsingFront ? .front : .back
                      if let device = AVCaptureDevice.default(.builtInWideAngleCamera, for: .video, position: pos),
                         let input = try? AVCaptureDeviceInput(device: device),
                         self.session.canAddInput(input) {
                          self.session.addInput(input)
                      }

                      if self.session.outputs.isEmpty, self.session.canAddOutput(self.photoOutput) {
                          self.session.addOutput(self.photoOutput)
                      }
                      self.session.commitConfiguration()
                      if !self.session.isRunning { self.session.startRunning() }
                      self.applyTorch(self.flashOn)
                  }
              }

              func stop() {
                  applyTorch(false)
                  queue.async {
                      if self.session.isRunning { self.session.stopRunning() }
                  }
              }

              func flip() {
                  isUsingFront.toggle()
                  if isAuthorized { configureSession() }
              }

              func toggleFlash() {
                  flashOn.toggle()
                  applyTorch(flashOn)
              }

              private func applyTorch(_ on: Bool) {
                  queue.async {
                      let pos: AVCaptureDevice.Position = self.isUsingFront ? .front : .back
                      guard let device = AVCaptureDevice.default(.builtInWideAngleCamera, for: .video, position: pos),
                            device.hasTorch, device.isTorchAvailable else { return }
                      try? device.lockForConfiguration()
                      device.torchMode = on ? .on : .off
                      device.unlockForConfiguration()
                  }
              }

              func capturePhoto(completion: @escaping (UIImage?) -> Void) {
                  guard isAuthorized else { completion(nil); return }
                  photoCompletion = completion
                  let settings = AVCapturePhotoSettings()
                  photoOutput.capturePhoto(with: settings, delegate: self)
              }

              func photoOutput(_ output: AVCapturePhotoOutput, didFinishProcessingPhoto photo: AVCapturePhoto, error: Error?) {
                  let data = photo.fileDataRepresentation()
                  let img = data.flatMap { UIImage(data: $0) }
                  DispatchQueue.main.async {
                      self.photoCompletion?(img)
                      self.photoCompletion = nil
                  }
              }
          }


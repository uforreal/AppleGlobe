name: Build Globe IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Create Swift App Code
        run: |
          cat << 'EOF' > App.swift
          import SwiftUI
          import MapKit

          struct FlightySheetView: View {
              @State private var selectedTab = 0

              var body: some View {
                  VStack(spacing: 0) {
                      // 1. Sheet Header
                      VStack(alignment: .leading, spacing: 14) {
                          Text("My Flights")
                              .font(.system(size: 32, weight: .bold))
                              .foregroundColor(.black)

                          Spacer()

                          // Syncing State (exactly like Flighty)
                          VStack(spacing: 6) {
                              Text("Syncing...")
                                  .font(.system(size: 15, weight: .semibold))
                                  .foregroundColor(.secondary)
                              Text("Restoring your flights")
                                  .font(.system(size: 13))
                                  .foregroundColor(.secondary.opacity(0.8))
                          }
                          .frame(maxWidth: .infinity)

                          Spacer()
                      }
                      .padding(.horizontal, 24)
                      .padding(.top, 24)

                      // 2. Flighty's Exact Bottom Tab Bar
                      HStack(spacing: 16) {
                          // Tab 1: My Flights (Active Pill)
                          HStack(spacing: 8) {
                              Image(systemName: "airplane")
                                  .font(.subheadline)
                              Text("My Flights")
                                  .font(.subheadline)
                                  .fontWeight(.semibold)
                          }
                          .padding(.horizontal, 16)
                          .padding(.vertical, 10)
                          .background(Color.blue.opacity(0.15))
                          .foregroundColor(.blue)
                          .clipShape(Capsule())

                          // Tab 2: Friends
                          HStack(spacing: 6) {
                              Image(systemName: "person.2.fill")
                                  .font(.subheadline)
                              Text("Friends")
                                  .font(.subheadline)
                                  .fontWeight(.medium)
                          }
                          .foregroundColor(.gray)

                          // Tab 3: Passport
                          HStack(spacing: 6) {
                              Image(systemName: "chart.bar.fill")
                                  .font(.subheadline)
                              Text("Passport")
                                  .font(.subheadline)
                                  .fontWeight(.medium)
                          }
                          .foregroundColor(.gray)
                      }
                      .padding(.horizontal, 20)
                      .padding(.bottom, 24)
                  }
                  .frame(maxWidth: .infinity, maxHeight: .infinity)
                  // Flighty's clean white background
                  .background(Color.white)
              }
          }

          @main
          struct GlobeApp: App {
              @State private var showSheet = true

              var body: some Scene {
                  WindowGroup {
                      // 1. Hybrid Satellite with Real Labels (Ocean & Countries)
                      Map()
                          .mapStyle(.hybrid(elevation: .realistic))
                          .ignoresSafeArea()
                          // 2. Flighty's Card Sheet
                          .sheet(isPresented: $showSheet) {
                              FlightySheetView()
                                  .presentationDetents([.fraction(0.38), .fraction(0.88)])
                                  .presentationDragIndicator(.hidden)
                                  .presentationBackgroundInteraction(.enabled(upThrough: .fraction(0.38)))
                                  .presentationCornerRadius(34)
                          }
                  }
              }
          }
          EOF

      - name: Create Info.plist
        run: |
          cat << 'EOF' > Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>GlobeApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.custom.globe</string>
              <key>CFBundleName</key>
              <string>Flighty</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>17.0</string>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Compile App Binary
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc -sdk "$SDK_PATH" -target arm64-apple-ios17.0 -parse-as-library -framework SwiftUI -framework MapKit -framework UIKit App.swift -o GlobeApp

      - name: Package into IPA
        run: |
          mkdir -p Payload/GlobeApp.app
          cp GlobeApp Payload/GlobeApp.app/
          cp Info.plist Payload/GlobeApp.app/
          zip -r Globe.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Globe-IPA
          path: Globe.ipa

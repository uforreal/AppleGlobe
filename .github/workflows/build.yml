name: Build Globe IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Create Swift App Code
        run: |
          cat << 'EOF' > App.swift
          import SwiftUI
          import MapKit

          // MARK: - 1. Custom Dock Icons
          struct FlightyAirplaneIcon: View {
              var body: some View {
                  ZStack {
                      Circle()
                          .fill(Color(red: 0.05, green: 0.47, blue: 0.99))
                          .frame(width: 25, height: 25)
                          .overlay(
                              Image(systemName: "airplane")
                                  .font(.system(size: 13, weight: .bold))
                                  .foregroundColor(.white)
                                  .rotationEffect(.degrees(-45))
                          )
                      
                      ZStack {
                          Circle()
                              .fill(Color.white)
                              .frame(width: 13, height: 13)
                          Circle()
                              .fill(Color(red: 0.05, green: 0.47, blue: 0.99))
                              .frame(width: 10.5, height: 10.5)
                          Image(systemName: "person.fill")
                              .font(.system(size: 6))
                              .foregroundColor(.white)
                      }
                      .offset(x: 9, y: 8)
                  }
                  .frame(width: 32, height: 28)
              }
          }

          struct FlightyFriendsIcon: View {
              var body: some View {
                  ZStack {
                      ZStack {
                          Image(systemName: "bubble.middle.bottom.fill")
                              .font(.system(size: 15))
                          Image(systemName: "person.fill")
                              .font(.system(size: 6))
                              .foregroundColor(Color(red: 0.93, green: 0.94, blue: 0.95))
                              .offset(y: -1.5)
                      }
                      .offset(x: -5, y: -2)

                      ZStack {
                          Image(systemName: "bubble.middle.bottom.fill")
                              .font(.system(size: 17))
                          Image(systemName: "person.fill")
                              .font(.system(size: 7))
                              .foregroundColor(Color(red: 0.93, green: 0.94, blue: 0.95))
                              .offset(y: -2)
                      }
                      .offset(x: 5, y: 2)
                  }
                  .foregroundColor(Color(red: 0.15, green: 0.15, blue: 0.16))
                  .frame(width: 32, height: 28)
              }
          }

          struct FlightyPassportIcon: View {
              var body: some View {
                  ZStack {
                      RoundedRectangle(cornerRadius: 3.5)
                          .fill(Color(red: 0.15, green: 0.15, blue: 0.16))
                          .frame(width: 18, height: 24)
                      
                      Rectangle()
                          .fill(Color.white.opacity(0.2))
                          .frame(width: 1, height: 24)
                          .offset(x: -7)

                      VStack(spacing: 2.5) {
                          Image(systemName: "globe.americas.fill")
                              .font(.system(size: 8))
                              .foregroundColor(.white.opacity(0.9))
                          
                          RoundedRectangle(cornerRadius: 0.5)
                              .fill(Color.white.opacity(0.8))
                              .frame(width: 7, height: 1.2)
                      }
                  }
                  .frame(width: 32, height: 28)
              }
          }

          // MARK: - 2. Bottom Sheet View
          struct FlightySheetView: View {
              var body: some View {
                  VStack(spacing: 0) {
                      // Top Row: Title + Profile/Share Actions
                      HStack(alignment: .center) {
                          Text("My Flights")
                              .font(.system(size: 32, weight: .bold))
                              .foregroundColor(.black)
                          
                          Spacer()
                          
                          HStack(spacing: 8) {
                              Button(action: {}) {
                                  Image(systemName: "square.and.arrow.up")
                                      .font(.system(size: 15, weight: .semibold))
                                      .foregroundColor(.black)
                                      .frame(width: 40, height: 40)
                                      .background(Color(red: 0.94, green: 0.94, blue: 0.96))
                                      .clipShape(Circle())
                              }
                              
                              Button(action: {}) {
                                  Image(systemName: "person.crop.circle.fill")
                                      .font(.system(size: 30))
                                      .foregroundColor(.gray.opacity(0.45))
                                      .frame(width: 40, height: 40)
                                      .background(Color(red: 0.94, green: 0.94, blue: 0.96))
                                      .clipShape(Circle())
                              }
                          }
                      }
                      .padding(.horizontal, 20)
                      .padding(.top, 16)

                      Spacer()

                      // Middle: Sync Status
                      VStack(spacing: 4) {
                          Text("Syncing...")
                              .font(.system(size: 15, weight: .semibold))
                              .foregroundColor(Color(red: 0.45, green: 0.46, blue: 0.48))
                          Text("Restoring your flights")
                              .font(.system(size: 13))
                              .foregroundColor(Color(red: 0.58, green: 0.59, blue: 0.61))
                      }

                      Spacer()

                      // Bottom Dock (Tightly anchored)
                      HStack(spacing: 10) {
                          HStack(spacing: 0) {
                              // Tab 1: My Flights
                              VStack(spacing: 2) {
                                  FlightyAirplaneIcon()
                                  Text("My Flights")
                                      .font(.system(size: 10, weight: .bold))
                                      .foregroundColor(Color(red: 0.05, green: 0.47, blue: 0.99))
                              }
                              .frame(maxWidth: .infinity, maxHeight: .infinity)
                              .background(Color.white)
                              .clipShape(Capsule())
                              .shadow(color: .black.opacity(0.04), radius: 2, y: 1)
                              .padding(4)

                              // Tab 2: Friends
                              VStack(spacing: 2) {
                                  FlightyFriendsIcon()
                                  Text("Friends")
                                      .font(.system(size: 10, weight: .semibold))
                                      .foregroundColor(Color(red: 0.25, green: 0.26, blue: 0.28))
                              }
                              .frame(maxWidth: .infinity)

                              // Tab 3: Passport
                              VStack(spacing: 2) {
                                  FlightyPassportIcon()
                                  Text("Passport")
                                      .font(.system(size: 10, weight: .semibold))
                                      .foregroundColor(Color(red: 0.25, green: 0.26, blue: 0.28))
                              }
                              .frame(maxWidth: .infinity)
                          }
                          .frame(height: 56)
                          .background(Color(red: 0.94, green: 0.94, blue: 0.96))
                          .clipShape(Capsule())

                          // Global Search Button
                          Button(action: {}) {
                              Image(systemName: "magnifyingglass")
                                  .font(.system(size: 19, weight: .bold))
                                  .foregroundColor(.black)
                                  .frame(width: 56, height: 56)
                                  .background(Color(red: 0.94, green: 0.94, blue: 0.96))
                                  .clipShape(Circle())
                          }
                      }
                      .padding(.horizontal, 16)
                      .padding(.bottom, 14)
                  }
                  .frame(maxWidth: .infinity, maxHeight: .infinity)
                  .background(Color.white)
                  .ignoresSafeArea(edges: .bottom)
              }
          }

          // MARK: - 3. Main App Entry
          @main
          struct GlobeApp: App {
              @State private var showSheet = true
              @State private var sheetDetent: PresentationDetent = .fraction(0.30)

              var body: some Scene {
                  WindowGroup {
                      ZStack(alignment: .topTrailing) {
                          Map()
                              .mapStyle(.hybrid(elevation: .realistic))
                              .ignoresSafeArea()

                          // Top-Right Floating Controls
                          VStack(spacing: 0) {
                              Button(action: {}) {
                                  Image(systemName: "map.fill")
                                      .font(.system(size: 16))
                                      .foregroundColor(.white)
                                      .frame(width: 44, height: 38)
                              }
                              Button(action: {}) {
                                  Image(systemName: "cloud.fill")
                                      .font(.system(size: 16))
                                      .foregroundColor(.white)
                                      .frame(width: 44, height: 38)
                              }
                              Divider()
                                  .background(Color.white.opacity(0.35))
                                  .frame(width: 26)
                                  .padding(.vertical, 3)
                              Button(action: {}) {
                                  Image(systemName: "antenna.radiowaves.left.and.right")
                                      .font(.system(size: 16))
                                      .foregroundColor(.white)
                                      .frame(width: 44, height: 38)
                              }
                          }
                          .padding(.vertical, 6)
                          .background(.ultraThinMaterial)
                          .clipShape(Capsule())
                          .shadow(color: .black.opacity(0.25), radius: 8)
                          .padding(.top, 56)
                          .padding(.trailing, 16)
                      }
                      .sheet(isPresented: $showSheet) {
                          FlightySheetView()
                              // Adjusted middle detent from 0.58 -> 0.65 to align right under ATLAS
                              .presentationDetents(
                                  [.fraction(0.30), .fraction(0.65), .large],
                                  selection: $sheetDetent
                              )
                              .interactiveDismissDisabled(true)
                              .presentationDragIndicator(.hidden)
                              .presentationBackgroundInteraction(.enabled(upThrough: .fraction(0.65)))
                              .presentationCornerRadius(32)
                      }
                  }
              }
          }
          EOF

      - name: Create Info.plist
        run: |
          cat << 'EOF' > Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>GlobeApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.custom.globe</string>
              <key>CFBundleName</key>
              <string>Flighty</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>17.0</string>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Compile App Binary
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc -sdk "$SDK_PATH" -target arm64-apple-ios17.0 -parse-as-library -framework SwiftUI -framework MapKit -framework UIKit App.swift -o GlobeApp

      - name: Package into IPA
        run: |
          mkdir -p Payload/GlobeApp.app
          cp GlobeApp Payload/GlobeApp.app/
          cp Info.plist Payload/GlobeApp.app/
          zip -r Globe.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Globe-IPA
          path: Globe.ipa

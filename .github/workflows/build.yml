          final class VoiceRecorderController: NSObject, ObservableObject, AVAudioPlayerDelegate {
              @Published var isRecording = false
              @Published var isStopped = false
              @Published var levels: [CGFloat] = []
              @Published var playFraction: CGFloat? = nil
              @Published var duration: TimeInterval = 0

              private var recorder: AVAudioRecorder?
              private var player: AVAudioPlayer?
              private var tickTimer: Timer?
              private var playTimer: Timer?
              private var startDate = Date()
              private var fileURL: URL?

              func start() {
                  reset()
                  isRecording = true
                  isStopped = false
                  startDate = Date()

                  AVAudioSession.sharedInstance().requestRecordPermission { [weak self] granted in
                      DispatchQueue.main.async {
                          guard let self, self.isRecording, !self.isStopped else { return }
                          if granted {
                              let url = FileManager.default.temporaryDirectory.appendingPathComponent(UUID().uuidString + ".m4a")
                              self.fileURL = url
                              try? AVAudioSession.sharedInstance().setCategory(.playAndRecord, mode: .default, options: [.defaultToSpeaker])
                              try? AVAudioSession.sharedInstance().setActive(true)
                              let settings: [String: Any] = [
                                  AVFormatIDKey: Int(kAudioFormatMPEG4AAC),
                                  AVSampleRateKey: 22050,
                                  AVNumberOfChannelsKey: 1,
                                  AVEncoderAudioQualityKey: AVAudioQuality.medium.rawValue
                              ]
                              if let rec = try? AVAudioRecorder(url: url, settings: settings) {
                                  rec.isMeteringEnabled = true
                                  rec.record()
                                  self.recorder = rec
                              }
                          }
                      }
                  }

                  tickTimer = Timer.scheduledTimer(withTimeInterval: 0.08, repeats: true) { [weak self] _ in
                      guard let self, self.isRecording, !self.isStopped else { return }
                      let v: CGFloat
                      if let rec = self.recorder, rec.isRecording {
                          rec.updateMeters()
                          let db = rec.averagePower(forChannel: 0)
                          v = max(0.05, min(1.0, CGFloat((db + 50) / 50)))
                      } else {
                          let t = Date().timeIntervalSince(self.startDate)
                          v = 0.2 + 0.8 * CGFloat.random(in: 0...1) * (0.5 + 0.5 * CGFloat(sin(t / 0.26)))
                      }
                      self.levels.append(v)
                  }
              }

              func freeze() {
                  guard isRecording, !isStopped else { return }
                  isStopped = true
                  duration = max(1, Date().timeIntervalSince(startDate))
                  tickTimer?.invalidate()
                  tickTimer = nil
                  recorder?.stop()
                  recorder = nil
              }

              func togglePlayPreview() {
                  guard isStopped else { freeze(); return }
                  playTimer?.invalidate()
                  player?.stop()
                  if let url = fileURL, let p = try? AVAudioPlayer(contentsOf: url) {
                      player = p
                      p.delegate = self
                      p.play()
                  }
                  let playStart = Date()
                  let dur = max(0.5, duration)
                  playTimer = Timer.scheduledTimer(withTimeInterval: 0.05, repeats: true) { [weak self] _ in
                      guard let self else { return }
                      let f = CGFloat(Date().timeIntervalSince(playStart) / dur)
                      if f >= 1.0 {
                          self.playTimer?.invalidate()
                          self.playFraction = nil
                      } else {
                          self.playFraction = f
                      }
                  }
              }

              func buildAttachment() -> AttachmentItem {
                  freeze()
                  let bars: [CGFloat] = (0..<14).map { i in
                      guard !levels.isEmpty else { return 0.2 }
                      let idx = min(levels.count - 1, i * levels.count / 14)
                      return levels[idx]
                  }
                  let item = AttachmentItem(kind: .voice(bars: bars, duration: duration, url: fileURL))
                  fileURL = nil
                  reset(deleteFile: false)
                  return item
              }

              func playClip(url: URL?) {
                  guard let url else { return }
                  player?.stop()
                  try? AVAudioSession.sharedInstance().setCategory(.playback, mode: .default)
                  try? AVAudioSession.sharedInstance().setActive(true)
                  if let p = try? AVAudioPlayer(contentsOf: url) {
                      player = p
                      p.play()
                  }
              }

              func reset(deleteFile: Bool = true) {
                  tickTimer?.invalidate(); tickTimer = nil
                  playTimer?.invalidate(); playTimer = nil
                  recorder?.stop(); recorder = nil
                  player?.stop(); player = nil
                  if deleteFile, let url = fileURL { try? FileManager.default.removeItem(at: url) }
                  fileURL = nil
                  isRecording = false
                  isStopped = false
                  levels = []
                  playFraction = nil
                  duration = 0
              }
          }


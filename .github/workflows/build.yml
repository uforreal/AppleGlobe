                              }
                          }
                          .background(Color.white, in: RoundedRectangle(cornerRadius: 23, style: .continuous))
                          .shadow(color: .black.opacity(0.10), radius: 10, y: 2)
                          .padding(.horizontal, 14)
                          .padding(.bottom, 18)
                      }
                      .background(Color.white)

                      if mode == .gallery {
                          ComposerGalleryView(
                              pickedIndices: $galleryPicked,
                              onBack: {
                                  mode = .editor
                                  sheetDetent = .large
                              },
                              onAddColors: { palettes in
                                  for p in palettes {
                                      attachments.append(AttachmentItem(kind: .image(uiImage: nil, gradient: p)))
                                  }
                                  galleryPicked = []
                                  mode = .editor
                                  sheetDetent = .large
                              },
                              onAddPickedImages: { images in
                                  for img in images {
                                      attachments.append(AttachmentItem(kind: .image(uiImage: img, gradient: [])))
                                  }
                                  galleryPicked = []
                                  mode = .editor
                                  sheetDetent = .large
                              }
                          )
                          .transition(.opacity)
                      }

                      if mode == .camera {
                          ComposerCameraView(
                              onClose: { mode = .editor },
                              onCapture: { img in
                                  let fallback = [Color(red: 217/255, green: 214/255, blue: 208/255), Color(red: 207/255, green: 196/255, blue: 176/255), Color(red: 185/255, green: 171/255, blue: 146/255)]
                                  attachments.append(AttachmentItem(kind: .image(uiImage: img, gradient: fallback)))
                                  mode = .editor
                              }
                          )
                          .transition(.opacity)
                      }
                  }
                  .onDisappear { recorder.reset() }
              }

              private var toolRow: some View {
                  HStack {
                      toolBtn(icon: "wand.and.stars") {}
                      Spacer()
                      toolBtn(icon: "photo.on.rectangle") {
                          galleryPicked = []
                          mode = .gallery
                          sheetDetent = .height(479)
                      }
                      Spacer()
                      toolBtn(icon: "camera") {
                          focusedField = nil
                          mode = .camera
                      }
                      Spacer()
                      toolBtn(icon: "waveform") {
                          focusedField = nil
                          recorder.start()
                      }
                      Spacer()
                      toolBtn(icon: "location") {}
                      Spacer()
                      toolBtn(icon: "sparkles") {}
                  }
                  .padding(.horizontal, 18)
                  .frame(height: 46)
              }

              private var voiceRecorderRow: some View {
                  HStack(spacing: 10) {
                      Button(action: { recorder.reset() }) {
                          Image(systemName: "xmark")
                              .font(.system(size: 13, weight: .bold))
                              .foregroundColor(.black)
                              .frame(width: 36, height: 36)
                              .background(Color(red: 239/255, green: 239/255, blue: 241/255), in: Circle())
                      }

                      HStack(spacing: 0) {
                          ForEach(0..<34, id: \.self) { i in
                              let val: CGFloat? = {
                                  let idx = recorder.levels.count - 34 + i
                                  guard idx >= 0, idx < recorder.levels.count else { return nil }
                                  return recorder.levels[idx]
                              }()
                              let dimmed = recorder.playFraction.map { CGFloat(i) / 34.0 > $0 } ?? false
                              RoundedRectangle(cornerRadius: 2)
                                  .fill(val == nil ? Color(red: 212/255, green: 212/255, blue: 217/255) : (dimmed ? Color(red: 180/255, green: 180/255, blue: 186/255) : Color(red: 44/255, green: 44/255, blue: 46/255)))
                                  .frame(width: 4, height: val.map { 4 + $0 * 20 } ?? 4)
                              if i < 33 { Spacer(minLength: 1) }
                          }
                      }
                      .frame(height: 36)

                      Button(action: { recorder.togglePlayPreview() }) {
                          Image(systemName: recorder.isStopped ? "play.fill" : "stop.fill")
                              .font(.system(size: 12, weight: .bold))
                              .foregroundColor(.black)
                              .frame(width: 36, height: 36)
                              .background(Color(red: 239/255, green: 239/255, blue: 241/255), in: Circle())
                      }

                      Button(action: {
                          attachments.append(recorder.buildAttachment())
                      }) {
                          Image(systemName: "arrow.up")
                              .font(.system(size: 15, weight: .bold))
                              .foregroundColor(.white)
                              .frame(width: 36, height: 36)
                              .background(Color(red: 61/255, green: 109/255, blue: 242/255), in: Circle())
                      }
                  }
                  .padding(.horizontal, 6)
                  .frame(height: 46)
              }

              @ViewBuilder
              private func attachmentChip(_ att: AttachmentItem) -> some View {
                  ZStack(alignment: .topTrailing) {
                      switch att.kind {
                      case .image(let img, let grad):
                          Group {
                              if let img {
                                  Image(uiImage: img).resizable().scaledToFill()
                              } else {
                                  LinearGradient(colors: grad, startPoint: .top, endPoint: .bottom)
                              }
                          }
                          .frame(width: 64, height: 64)
                          .clipShape(RoundedRectangle(cornerRadius: 14, style: .continuous))

                      case .voice(let bars, let dur, let url):
                          Button(action: { recorder.playClip(url: url) }) {
                              HStack(spacing: 10) {
                                  Circle()
                                      .fill(Color(red: 61/255, green: 109/255, blue: 242/255))
                                      .frame(width: 30, height: 30)
                                      .overlay(Image(systemName: "play.fill").font(.system(size: 10)).foregroundColor(.white))

                                  HStack(spacing: 2) {
                                      ForEach(Array(bars.enumerated()), id: \.offset) { _, v in
                                          RoundedRectangle(cornerRadius: 1.5)
                                              .fill(Color(white: 0.56))
                                              .frame(width: 3, height: 3 + v * 14)
                                      }
                                  }

                                  Text(formatDuration(dur))
                                      .font(.system(size: 13, weight: .semibold).monospacedDigit())
                                      .foregroundColor(Color(white: 0.23))
                              }
                              .padding(.leading, 12)
                              .padding(.trailing, 28)
                              .frame(height: 64)
                              .background(Color(red: 242/255, green: 242/255, blue: 247/255), in: RoundedRectangle(cornerRadius: 14, style: .continuous))
                          }
                          .buttonStyle(.plain)
                      }

                      Button(action: {
                          attachments.removeAll { $0.id == att.id }
                      }) {
                          Image(systemName: "xmark")
                              .font(.system(size: 9, weight: .bold))
                              .foregroundColor(.white)
                              .frame(width: 22, height: 22)
                              .background(Color(red: 36/255, green: 36/255, blue: 48/255).opacity(0.75), in: Circle())
                      }
                      .padding(5)
                  }
              }

              private func toolBtn(icon: String, action: @escaping () -> Void) -> some View {
                  Button(action: action) {
                      Image(systemName: icon)
                          .font(.system(size: 20, weight: .regular))
                          .foregroundColor(.black)
                          .frame(width: 34, height: 46)
                  }
                  .buttonStyle(.plain)
              }

              private func formatDuration(_ s: TimeInterval) -> String {
                  let total = max(1, Int(s.rounded()))
                  return "\(total / 60):\(String(format: "%02d", total % 60))"
              }

              private func closeAll() {
                  recorder.reset()
                  focusedField = nil
                  onClose()
              }
          }

          // MARK: - 7. Bottom Sheet View

          struct FlightySheetView: View {
              @Binding var sheetDetent: PresentationDetent

              @State private var currentTab: MainTab = .world
              @State private var posts = SampleData.initialPosts
              @State private var friends = SampleData.initialFriends
              @State private var chatFilter: ChatFilter = .all
              @State private var friendsFeedMode = false
              @State private var pinsFriendsMode = false

              @State private var isEditing = false
              @State private var activeChatIndex: Int? = nil
              @State private var detentBeforeModal: PresentationDetent = .height(264)

              private var friendNames: Set<String> { Set(friends.map { $0.name }) }

              var body: some View {
                  ZStack {
                      VStack(spacing: 0) {
                          // Header
                          HStack(alignment: .center) {
                              Text(currentTab.title)
                                  .font(.system(size: 34, weight: .bold))
                                  .foregroundColor(.black)

                              Spacer()

                              HStack(spacing: 10) {
                                  if currentTab == .friends || currentTab == .pins {
                                      let swapOn = currentTab == .friends ? friendsFeedMode : pinsFriendsMode
                                      Button(action: toggleSwap) {
                                          Image(systemName: "arrow.left.arrow.right")
                                              .font(.system(size: 17, weight: .semibold))
                                              .foregroundColor(swapOn ? .white : .black)
                                              .frame(width: 44, height: 44)
                                              .background(swapOn ? SampleData.brandBlue : Color(white: 0.98), in: Circle())
                                              .shadow(color: .black.opacity(0.10), radius: 4, y: 2)
                                      }
                                  }

                                  Button(action: {}) {
                                      Image(systemName: "magnifyingglass")
                                          .font(.system(size: 18, weight: .semibold))
                                          .foregroundColor(.black)
                                          .frame(width: 44, height: 44)
                                          .flightyGlass(in: Circle(), fallback: Color(white: 0.98))
                                  }

                                  Button(action: {}) {
                                      FlightyAvatar()
                                  }
                              }
                          }
                          .padding(.horizontal, 20)
                          .padding(.top, 14)

                          // Friends filter row
                          if currentTab == .friends {
                              HStack(spacing: 4) {
                                  segButton("Everyone", selected: chatFilter == .all) { chatFilter = .all }
                                  segButton("Today", selected: chatFilter == .today) { chatFilter = .today }

                                  Button(action: {}) {
                                      HStack(spacing: 8) {
                                          Image(systemName: "plus")
                                              .font(.system(size: 13, weight: .bold))
                                              .foregroundColor(.white)
                                              .frame(width: 28, height: 28)
                                              .background(SampleData.brandBlue, in: Circle())
                                          Text("Add Friend")
                                              .font(.system(size: 17, weight: .medium))
                                              .foregroundColor(SampleData.brandBlue)
                                      }
                                      .padding(.leading, 8)
                                  }
                                  .buttonStyle(.plain)
                                  Spacer()
                              }
                              .padding(.horizontal, 20)
                              .padding(.top, 10)
                              .padding(.bottom, 6)
                          }

                          // Tab content
                          ScrollView {
                              LazyVStack(spacing: 0) {
                                  contentList
                              }
                              .padding(.horizontal, 20)
                              .padding(.bottom, 10)
                          }
                          .scrollIndicators(.hidden)
                          .scrollDisabled(sheetDetent != .large)

                          // Bottom dock
                          HStack(spacing: 8) {
                              HStack(spacing: 0) {
                                  FlightyTab(title: "World", selected: currentTab == .world, action: { currentTab = .world }) {
                                      FlightyAirplaneIcon(selected: currentTab == .world)
                                  }
                                  FlightyTab(title: "Friends", selected: currentTab == .friends, action: { currentTab = .friends }) {
                                      FlightyFriendsIcon(selected: currentTab == .friends)
                                  }
                                  FlightyTab(title: "Pins", selected: currentTab == .pins, action: { currentTab = .pins }) {
                                      FlightyPassportIcon(selected: currentTab == .pins)
                                  }
                              }
                              .padding(4)
                              .frame(height: 62)
                              .flightyGlass(in: Capsule(), fallback: Color(white: 0.97))

                              Button(action: openEditor) {
                                  Image(systemName: "plus")
                                      .font(.system(size: 22, weight: .semibold))
                                      .foregroundColor(.black)
                                      .frame(width: 62, height: 62)
                                      .flightyGlass(in: Circle(), fallback: Color(white: 0.97))
                              }
                          }
                          .padding(.horizontal, 18)
                          .padding(.bottom, 18)
                      }
                      .opacity((isEditing || activeChatIndex != nil) ? 0 : 1)

                      if isEditing {
                          ComposerEditorView(sheetDetent: $sheetDetent, onClose: closeEditor)
                              .transition(.opacity)
                      }

                      if let idx = activeChatIndex {
                          ChatDetailView(friend: $friends[idx], onBack: closeChat)
                              .transition(.opacity)
                      }
                  }
                  .frame(maxWidth: .infinity, maxHeight: .infinity)
                  .background(Color.white)
                  .ignoresSafeArea(edges: .bottom)
                  .persistentSystemOverlays(.hidden)
              }

              @ViewBuilder
              private var contentList: some View {
                  switch currentTab {
                  case .world:
                      ForEach($posts) { $post in
                          PostRowView(post: $post)
                          Divider().opacity(0.45)
                      }

                  case .friends:
                      if friendsFeedMode {
                          ForEach($posts) { $post in
                              if friendNames.contains(post.name) {
                                  PostRowView(post: $post)
                                  Divider().opacity(0.45)
                              }
                          }
                      } else {
                          let filteredIndices = friends.indices.filter { idx in
                              chatFilter == .all || friends[idx].time.hasSuffix("AM") || friends[idx].time.hasSuffix("PM")
                          }
                          if filteredIndices.isEmpty {
                              Text("No chats today")
                                  .font(.system(size: 15))
                                  .foregroundColor(Color(white: 0.6))
                                  .padding(.vertical, 40)
                          } else {
                              ForEach(filteredIndices, id: \.self) { idx in
                                  Button(action: { openChat(idx) }) {
                                      ChatRowView(friend: friends[idx])
                                  }
                                  .buttonStyle(.plain)
                                  Divider().opacity(0.45)
                              }
                          }
                      }

                  case .pins:
                      if pinsFriendsMode {
                          ForEach(friends) { friend in
                              HStack(spacing: 12) {
                                  Circle()
                                      .fill(friend.color)
                                      .frame(width: 46, height: 46)
                                      .overlay(Text(String(friend.name.prefix(1))).font(.system(size: 18, weight: .semibold)).foregroundColor(.white))
                                  VStack(alignment: .leading, spacing: 2) {
                                      HStack {
                                          Text(friend.name).font(.system(size: 16, weight: .semibold)).foregroundColor(.black)
                                          Spacer()
                                          Text("🌍").font(.system(size: 13))
                                      }
                                      Text("\(friend.countries) countries").font(.system(size: 14)).foregroundColor(Color(white: 0.56))
                                  }
                              }
                              .padding(.vertical, 10)
                              Divider().opacity(0.45)
                          }
                      } else {
                          Text("Pins go here")
                              .font(.system(size: 15))
                              .foregroundColor(Color(white: 0.6))
                              .padding(.vertical, 40)
                      }
                  }
              }

              @ViewBuilder
              private func segButton(_ label: String, selected: Bool, action: @escaping () -> Void) -> some View {
                  Button(action: action) {
                      Text(label)
                          .font(.system(size: 15, weight: .medium))
                          .foregroundColor(selected ? .black : Color(white: 0.56))
                          .padding(.horizontal, 14)
                          .padding(.vertical, 9)
                          .background(selected ? Color(white: 0.98) : Color.clear, in: Capsule())
                          .shadow(color: selected ? .black.opacity(0.09) : .clear, radius: 6, y: 2)
                  }
                  .buttonStyle(.plain)
              }

              private func toggleSwap() {
                  if currentTab == .friends { friendsFeedMode.toggle() }
                  else if currentTab == .pins { pinsFriendsMode.toggle() }
              }

              private func openEditor() {
                  detentBeforeModal = sheetDetent
                  withAnimation(.easeInOut(duration: 0.2)) { isEditing = true }
                  sheetDetent = .large
              }

              private func closeEditor() {
                  withAnimation(.easeInOut(duration: 0.2)) { isEditing = false }
                  sheetDetent = detentBeforeModal
              }

              private func openChat(_ idx: Int) {
                  detentBeforeModal = sheetDetent
                  friends[idx].unread = false
                  withAnimation(.easeInOut(duration: 0.2)) { activeChatIndex = idx }
                  sheetDetent = .large
              }

              private func closeChat() {
                  withAnimation(.easeInOut(duration: 0.2)) { activeChatIndex = nil }
                  sheetDetent = detentBeforeModal
              }
          }

          // MARK: - 8. Main App Entry

          @main
          struct GlobeApp: App {
              @State private var showSheet = true
              @State private var sheetDetent: PresentationDetent = .height(264)
              @State private var mapMenuOpen = false
              @State private var mapStyle: MapStyleKind = .standard
              @State private var selectedLayers: Set<MapLayerKind> = [.flights]

              private let darkGlass = Color(red: 28/255, green: 32/255, blue: 46/255).opacity(0.65)
              private var controlsOpacity: Double { sheetDetent == .large ? 0 : 1 }

              var body: some Scene {
                  WindowGroup {
                      ZStack(alignment: .topTrailing) {
                          Map()
                              .mapStyle(mapStyle == .satellite ? .hybrid(elevation: .realistic) : .standard(elevation: .realistic))
                              .ignoresSafeArea()
                              .onTapGesture {
                                  if mapMenuOpen { withAnimation(.spring(response: 0.22)) { mapMenuOpen = false } }
                              }

                          VStack(alignment: .trailing, spacing: 8) {
                              VStack(spacing: 0) {
                                  Button(action: {
                                      withAnimation(.spring(response: 0.22, dampingFraction: 0.85)) { mapMenuOpen.toggle() }
                                  }) {
                                      Image(systemName: "map.fill")
                                          .font(.system(size: 18, weight: .medium))
                                          .foregroundColor(.white)
                                          .frame(width: 43, height: 40)
                                          .background(mapMenuOpen ? Color.white.opacity(0.2) : .clear, in: Capsule())
                                  }
                                  Button(action: {}) {
                                      Image(systemName: "cloud")
                                          .font(.system(size: 18, weight: .medium))
                                          .foregroundColor(.white)
                                          .frame(width: 43, height: 40)
                                  }
                              }
                              .padding(.vertical, 2)
                              .flightyGlass(in: Capsule(), fallback: darkGlass)

                              Button(action: {}) {
                                  FlightyATCTowerIcon()
                                      .frame(width: 43, height: 43)
                                      .flightyGlass(in: Circle(), fallback: darkGlass)
                              }
                          }
                          .environment(\.colorScheme, .dark)
                          .padding(.top, 22)
                          .padding(.trailing, 16)
                          .opacity(controlsOpacity)
                          .allowsHitTesting(controlsOpacity > 0.5 && !mapMenuOpen)

                          if mapMenuOpen && controlsOpacity > 0.5 {
                              MapStyleMenu(mapStyle: $mapStyle, selectedLayers: $selectedLayers) {
                                  withAnimation(.spring(response: 0.2)) { mapMenuOpen = false }
                              }
                              .padding(.top, 22)
                              .padding(.trailing, 16)
                              .transition(.scale(scale: 0.85, anchor: .topTrailing).combined(with: .opacity))
                          }
                      }
                      .persistentSystemOverlays(.hidden)
                      .sheet(isPresented: $showSheet) {
                          FlightySheetView(sheetDetent: $sheetDetent)
                              .presentationDetents(
                                  [.height(264), .height(479), .large],
                                  selection: $sheetDetent
                              )
                              .interactiveDismissDisabled(true)
                              .presentationDragIndicator(.hidden)
                              .presentationBackgroundInteraction(.enabled(upThrough: .height(479)))
                              .presentationCornerRadius(42)
                              .presentationBackground(Color.white)
                      }
                  }
              }
          }
          EOF

      - name: Create Info.plist
        run: |
          cat << 'EOF' > Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>GlobeApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.custom.globe</string>
              <key>CFBundleName</key>
              <string>Flighty</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>17.0</string>
              <key>NSCameraUsageDescription</key>
              <string>Camera access is used to attach photos to your posts.</string>
              <key>NSMicrophoneUsageDescription</key>
              <string>Microphone access is used to record voice notes.</string>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>Photo library access is used to attach photos.</string>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Compile App Binary
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc -sdk "$SDK_PATH" -target arm64-apple-ios17.0 -parse-as-library -framework SwiftUI -framework MapKit -framework UIKit -framework AVFoundation -framework PhotosUI App.swift -o GlobeApp

      - name: Package into IPA
        run: |
          mkdir -p Payload/GlobeApp.app
          cp GlobeApp Payload/GlobeApp.app/
          cp Info.plist Payload/GlobeApp.app/
          zip -r Globe.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Globe-IPA
          path: Globe.ipa

name: Build Globe IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Create Swift App Code
        run: |
          cat << 'EOF' > App.swift
          import SwiftUI
          import MapKit

          struct FlightySheetView: View {
              var body: some View {
                  VStack(spacing: 0) {
                      // 1. Header with Title + Share & Profile Buttons
                      HStack(alignment: .center) {
                          Text("My Flights")
                              .font(.system(size: 32, weight: .heavy))
                              .foregroundColor(.black)
                          
                          Spacer()
                          
                          HStack(spacing: 12) {
                              // Share Button
                              Button(action: {}) {
                                  Image(systemName: "square.and.arrow.up")
                                      .font(.system(size: 16, weight: .semibold))
                                      .foregroundColor(.black)
                                      .frame(width: 44, height: 44)
                                      .background(Color(white: 0.94))
                                      .clipShape(Circle())
                              }
                              
                              // Profile Button
                              Button(action: {}) {
                                  Image(systemName: "person.crop.circle.fill")
                                      .font(.system(size: 32))
                                      .foregroundColor(.gray.opacity(0.6))
                                      .frame(width: 44, height: 44)
                                      .background(Color(white: 0.94))
                                      .clipShape(Circle())
                              }
                          }
                      }
                      .padding(.horizontal, 20)
                      .padding(.top, 20)

                      Spacer()

                      // 2. Centered Syncing Status
                      VStack(spacing: 5) {
                          Text("Syncing...")
                              .font(.system(size: 15, weight: .semibold))
                              .foregroundColor(.secondary)
                          Text("Restoring your flights")
                              .font(.system(size: 13))
                              .foregroundColor(.secondary.opacity(0.8))
                      }

                      Spacer()

                      // 3. Flighty's Exact Two-Piece Dock
                      HStack(spacing: 12) {
                          // Piece A: The 3-Tab Capsule Track
                          HStack(spacing: 0) {
                              // Tab 1: My Flights (Active Pill)
                              VStack(spacing: 4) {
                                  Image(systemName: "airplane.circle.fill")
                                      .font(.system(size: 20))
                                  Text("My Flights")
                                      .font(.system(size: 11, weight: .bold))
                              }
                              .foregroundColor(.blue)
                              .frame(maxWidth: .infinity, maxHeight: .infinity)
                              .background(Color.white)
                              .clipShape(Capsule())
                              .shadow(color: .black.opacity(0.06), radius: 4, y: 2)
                              .padding(4)

                              // Tab 2: Friends
                              VStack(spacing: 4) {
                                  Image(systemName: "person.2.fill")
                                      .font(.system(size: 17))
                                  Text("Friends")
                                      .font(.system(size: 11, weight: .semibold))
                              }
                              .foregroundColor(.black.opacity(0.75))
                              .frame(maxWidth: .infinity)

                              // Tab 3: Passport
                              VStack(spacing: 4) {
                                  Image(systemName: "book.pages.fill")
                                      .font(.system(size: 17))
                                  Text("Passport")
                                      .font(.system(size: 11, weight: .semibold))
                              }
                              .foregroundColor(.black.opacity(0.75))
                              .frame(maxWidth: .infinity)
                          }
                          .frame(height: 64)
                          .background(Color(white: 0.94))
                          .clipShape(Capsule())

                          // Piece B: Freestanding Search Button
                          Button(action: {}) {
                              Image(systemName: "magnifyingglass")
                                  .font(.system(size: 20, weight: .bold))
                                  .foregroundColor(.black)
                                  .frame(width: 64, height: 64)
                                  .background(Color(white: 0.94))
                                  .clipShape(Circle())
                          }
                      }
                      .padding(.horizontal, 16)
                      .padding(.bottom, 20)
                  }
                  .frame(maxWidth: .infinity, maxHeight: .infinity)
                  .background(Color.white)
              }
          }

          @main
          struct GlobeApp: App {
              @State private var showSheet = true

              var body: some Scene {
                  WindowGroup {
                      ZStack(alignment: .topTrailing) {
                          // 1. Hybrid 3D Globe
                          Map()
                              .mapStyle(.hybrid(elevation: .realistic))
                              .ignoresSafeArea()

                          // 2. Floating Map Tools (Layers, Weather, ATC)
                          VStack(spacing: 12) {
                              Button(action: {}) {
                                  Image(systemName: "map.fill")
                                      .font(.system(size: 18))
                                      .foregroundColor(.white)
                              }
                              Button(action: {}) {
                                  Image(systemName: "cloud.fill")
                                      .font(.system(size: 18))
                                      .foregroundColor(.white)
                              }
                              Button(action: {}) {
                                  Image(systemName: "antenna.radiowaves.left.and.right")
                                      .font(.system(size: 18))
                                      .foregroundColor(.white)
                              }
                          }
                          .padding(.vertical, 14)
                          .padding(.horizontal, 10)
                          .background(.ultraThinMaterial)
                          .clipShape(Capsule())
                          .shadow(color: .black.opacity(0.3), radius: 8)
                          .padding(.top, 60)
                          .padding(.trailing, 16)
                      }
                      // 3. Compact Bottom Sheet (Lower height so it doesn't cover Argelia)
                      .sheet(isPresented: $showSheet) {
                          FlightySheetView()
                              .presentationDetents([.fraction(0.35), .fraction(0.88)])
                              .presentationDragIndicator(.hidden)
                              .presentationBackgroundInteraction(.enabled(upThrough: .fraction(0.35)))
                              .presentationCornerRadius(38)
                      }
                  }
              }
          }
          EOF

      - name: Create Info.plist
        run: |
          cat << 'EOF' > Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>GlobeApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.custom.globe</string>
              <key>CFBundleName</key>
              <string>Flighty</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>17.0</string>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Compile App Binary
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc -sdk "$SDK_PATH" -target arm64-apple-ios17.0 -parse-as-library -framework SwiftUI -framework MapKit -framework UIKit App.swift -o GlobeApp

      - name: Package into IPA
        run: |
          mkdir -p Payload/GlobeApp.app
          cp GlobeApp Payload/GlobeApp.app/
          cp Info.plist Payload/GlobeApp.app/
          zip -r Globe.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Globe-IPA
          path: Globe.ipa

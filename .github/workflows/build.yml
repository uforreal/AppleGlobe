name: Build Globe IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Create Swift App Code
        run: |
          cat << 'EOF' > App.swift
          import SwiftUI
          import MapKit
          import UIKit

          // MARK: - 0. Helpers

          extension View {
              /// Liquid Glass effect with fallback
              @ViewBuilder
              func flightyGlass<S: Shape>(in shape: S, fallback: Color) -> some View {
                  #if compiler(>=6.2)
                  if #available(iOS 26.0, *) {
                      self.glassEffect(.regular, in: shape)
                  } else {
                      self.background(fallback, in: shape)
                          .shadow(color: .black.opacity(0.10), radius: 6, y: 2)
                  }
                  #else
                  self.background(fallback, in: shape)
                      .shadow(color: .black.opacity(0.10), radius: 6, y: 2)
                  #endif
              }
          }

          // MARK: - 1. Air Traffic Control Tower Icon

          struct ATCTowerShape: Shape {
              func path(in rect: CGRect) -> Path {
                  let sx = rect.width / 20
                  let sy = rect.height / 24
                  func pt(_ x: CGFloat, _ y: CGFloat) -> CGPoint {
                      CGPoint(x: rect.minX + x * sx, y: rect.minY + y * sy)
                  }
                  func box(_ x: CGFloat, _ y: CGFloat, _ w: CGFloat, _ h: CGFloat) -> CGRect {
                      CGRect(x: rect.minX + x * sx, y: rect.minY + y * sy, width: w * sx, height: h * sy)
                  }

                  var path = Path()

                  // Antenna
                  path.addRect(box(9.3, 0, 1.4, 3))
                  // Roof slab
                  path.addRect(box(2, 3, 16, 1.8))

                  // Cab (wider at the top)
                  path.move(to: pt(3, 4.8))
                  path.addLine(to: pt(17, 4.8))
                  path.addLine(to: pt(14, 11))
                  path.addLine(to: pt(6, 11))
                  path.closeSubpath()

                  // Window band
                  path.move(to: pt(4.6, 6.3))
                  path.addLine(to: pt(15.4, 6.3))
                  path.addLine(to: pt(14.1, 9.2))
                  path.addLine(to: pt(5.9, 9.2))
                  path.closeSubpath()

                  // Window divider
                  path.addRect(box(9.4, 6.3, 1.2, 2.9))

                  // Shaft
                  path.addRect(box(8.4, 11, 3.2, 5.5))

                  // Base flare
                  path.move(to: pt(8.4, 16.5))
                  path.addLine(to: pt(11.6, 16.5))
                  path.addLine(to: pt(15, 22))
                  path.addLine(to: pt(5, 22))
                  path.closeSubpath()

                  // Foot
                  path.addRect(box(3.5, 22, 13, 1.6))

                  return path
              }
          }

          struct FlightyATCTowerIcon: View {
              var body: some View {
                  ATCTowerShape()
                      .fill(Color.white, style: FillStyle(eoFill: true))
                      .frame(width: 17, height: 20)
              }
          }

          // MARK: - 2. Dock Icons

          struct FlightyAirplaneIcon: View {
              private let blue = Color(red: 0.0, green: 0.48, blue: 1.0)

              var body: some View {
                  ZStack {
                      Circle()
                          .fill(blue)
                          .frame(width: 24, height: 24)
                          .overlay(
                              Image(systemName: "airplane")
                                  .font(.system(size: 12.5, weight: .bold))
                                  .foregroundColor(.white)
                                  .rotationEffect(.degrees(-45))
                          )

                      ZStack {
                          Circle()
                              .fill(Color.white)
                              .frame(width: 13, height: 13)
                          Circle()
                              .fill(blue)
                              .frame(width: 10.5, height: 10.5)
                          Image(systemName: "person.fill")
                              .font(.system(size: 6))
                              .foregroundColor(.white)
                      }
                      .offset(x: 9, y: 8)
                  }
                  .frame(width: 32, height: 28)
              }
          }

          struct FlightyFriendsIcon: View {
              var body: some View {
                  ZStack {
                      ZStack {
                          Image(systemName: "bubble.middle.bottom.fill")
                              .font(.system(size: 16))
                          Image(systemName: "person.fill")
                              .font(.system(size: 6.5))
                              .foregroundColor(Color(white: 0.94))
                              .offset(y: -1.5)
                      }
                      .offset(x: -5, y: -2)

                      ZStack {
                          Image(systemName: "bubble.middle.bottom.fill")
                              .font(.system(size: 18))
                          Image(systemName: "person.fill")
                              .font(.system(size: 7.5))
                              .foregroundColor(Color(white: 0.94))
                              .offset(y: -2)
                      }
                      .offset(x: 5, y: 2)
                  }
                  .foregroundColor(Color(white: 0.12))
                  .frame(width: 32, height: 28)
              }
          }

          struct FlightyPassportIcon: View {
              var body: some View {
                  ZStack {
                      RoundedRectangle(cornerRadius: 3.5)
                          .fill(Color(white: 0.12))
                          .frame(width: 18, height: 24)

                      Rectangle()
                          .fill(Color.white.opacity(0.2))
                          .frame(width: 1, height: 24)
                          .offset(x: -7)

                      VStack(spacing: 2.5) {
                          Image(systemName: "globe.americas.fill")
                              .font(.system(size: 8))
                              .foregroundColor(.white.opacity(0.9))

                          RoundedRectangle(cornerRadius: 0.5)
                              .fill(Color.white.opacity(0.8))
                              .frame(width: 7, height: 1.2)
                      }
                  }
                  .frame(width: 32, height: 28)
              }
          }

          struct FlightyTab<Icon: View>: View {
              let title: String
              let selected: Bool
              let icon: Icon

              init(title: String, selected: Bool, @ViewBuilder icon: () -> Icon) {
                  self.title = title
                  self.selected = selected
                  self.icon = icon()
              }

              var body: some View {
                  VStack(spacing: 1) {
                      icon
                      Text(title)
                          .font(.system(size: 10, weight: selected ? .bold : .semibold))
                          .foregroundColor(selected ? Color(red: 0.0, green: 0.48, blue: 1.0) : Color(white: 0.12))
                  }
                  .frame(maxWidth: .infinity, maxHeight: .infinity)
                  .background {
                      if selected {
                          Capsule().fill(Color.black.opacity(0.07))
                      }
                  }
              }
          }

          // MARK: - 3. Avatar

          struct FlightyAvatar: View {
              var body: some View {
                  ZStack {
                      Circle()
                          .fill(
                              LinearGradient(
                                  colors: [Color(white: 0.80), Color(white: 0.62)],
                                  startPoint: .top,
                                  endPoint: .bottom
                              )
                          )
                      Image(systemName: "person.fill")
                          .font(.system(size: 22))
                          .foregroundColor(.white)
                          .offset(y: 5)
                  }
                  .frame(width: 38, height: 38)
                  .clipShape(Circle())
                  .frame(width: 44, height: 44)
                  .flightyGlass(in: Circle(), fallback: Color.white)
              }
          }

          // MARK: - 4. Native Flight Search Modal

          struct FlightySearchView: View {
              @Environment(\.dismiss) private var dismiss
              @State private var searchText = ""
              @FocusState private var isFieldFocused: Bool

              var body: some View {
                  VStack(spacing: 0) {
                      // Apple Native Text Input Bar
                      HStack(spacing: 12) {
                          HStack(spacing: 8) {
                              Image(systemName: "magnifyingglass")
                                  .foregroundColor(.secondary)
                                  .font(.system(size: 17, weight: .medium))

                              TextField("Flight #, route, or airline", text: $searchText)
                                  .font(.system(size: 16))
                                  .autocorrectionDisabled()
                                  .textInputAutocapitalization(.characters)
                                  .focused($isFieldFocused)

                              if !searchText.isEmpty {
                                  Button(action: { searchText = "" }) {
                                      Image(systemName: "xmark.circle.fill")
                                          .foregroundColor(.secondary)
                                          .font(.system(size: 16))
                                  }
                              }
                          }
                          .padding(.horizontal, 12)
                          .padding(.vertical, 10)
                          .background(Color(uiColor: .secondarySystemBackground))
                          .clipShape(RoundedRectangle(cornerRadius: 12, style: .continuous))

                          Button("Cancel") {
                              dismiss()
                          }
                          .font(.system(size: 16, weight: .regular))
                          .foregroundColor(.blue)
                      }
                      .padding(.horizontal, 16)
                      .padding(.top, 16)
                      .padding(.bottom, 12)

                      Divider()

                      // Search Results & Suggestions
                      List {
                          if searchText.isEmpty {
                              Section("Recent Searches") {
                                  HStack(spacing: 12) {
                                      Image(systemName: "airplane.departure")
                                          .font(.system(size: 18))
                                          .foregroundColor(.blue)
                                      VStack(alignment: .leading, spacing: 2) {
                                          Text("AA 100 · JFK → LHR")
                                              .font(.system(size: 15, weight: .semibold))
                                          Text("American Airlines · Boeing 777-300ER")
                                              .font(.system(size: 12))
                                              .foregroundColor(.secondary)
                                      }
                                  }
                                  .padding(.vertical, 2)

                                  HStack(spacing: 12) {
                                      Image(systemName: "airplane.departure")
                                          .font(.system(size: 18))
                                          .foregroundColor(.blue)
                                      VStack(alignment: .leading, spacing: 2) {
                                          Text("DL 412 · LAX → JFK")
                                              .font(.system(size: 15, weight: .semibold))
                                          Text("Delta Air Lines · Airbus A321neo")
                                              .font(.system(size: 12))
                                              .foregroundColor(.secondary)
                                      }
                                  }
                                  .padding(.vertical, 2)
                              }
                          } else {
                              Section("Matching Flights") {
                                  HStack(spacing: 12) {
                                      Image(systemName: "airplane")
                                          .font(.system(size: 18))
                                          .foregroundColor(.blue)
                                      VStack(alignment: .leading, spacing: 2) {
                                          Text("Flight \(searchText.uppercased())")
                                              .font(.system(size: 15, weight: .semibold))
                                          Text("Tap to view live flight status on the globe")
                                              .font(.system(size: 12))
                                              .foregroundColor(.secondary)
                                      }
                                  }
                                  .padding(.vertical, 2)
                              }
                          }
                      }
                      .listStyle(.insetGrouped)
                  }
                  .onAppear {
                      DispatchQueue.main.asyncAfter(deadline: .now() + 0.1) {
                          isFieldFocused = true
                      }
                  }
              }
          }

          // MARK: - 5. Bottom Sheet View

          struct FlightySheetView: View {
              @State private var showSearch = false

              var body: some View {
                  VStack(spacing: 0) {
                      // Header
                      HStack(alignment: .center) {
                          Text("My Flights")
                              .font(.system(size: 34, weight: .bold))
                              .foregroundColor(.black)

                          Spacer()

                          HStack(spacing: 10) {
                              Button(action: {}) {
                                  Image(systemName: "square.and.arrow.up")
                                      .font(.system(size: 17, weight: .semibold))
                                      .foregroundColor(.black)
                                      .frame(width: 44, height: 44)
                                      .flightyGlass(in: Circle(), fallback: Color(white: 0.97))
                              }

                              Button(action: {}) {
                                  FlightyAvatar()
                              }
                          }
                      }
                      .padding(.horizontal, 20)
                      .padding(.top, 14)

                      Spacer()

                      // Sync status
                      VStack(spacing: 4) {
                          Text("Syncing...")
                              .font(.system(size: 16, weight: .semibold))
                              .foregroundColor(Color(white: 0.55))
                          Text("Restoring your flights")
                              .font(.system(size: 15))
                              .foregroundColor(Color(white: 0.62))
                      }
                      .padding(.top, 8)

                      Spacer()

                      // Bottom dock
                      HStack(spacing: 8) {
                          HStack(spacing: 0) {
                              FlightyTab(title: "My Flights", selected: true) {
                                  FlightyAirplaneIcon()
                              }
                              FlightyTab(title: "Friends", selected: false) {
                                  FlightyFriendsIcon()
                              }
                              FlightyTab(title: "Passport", selected: false) {
                                  FlightyPassportIcon()
                              }
                          }
                          .padding(4)
                          .frame(height: 62)
                          .flightyGlass(in: Capsule(), fallback: Color(white: 0.97))

                          // Tapping this opens Apple's search input bar
                          Button(action: { showSearch = true }) {
                              Image(systemName: "magnifyingglass")
                                  .font(.system(size: 20, weight: .semibold))
                                  .foregroundColor(.black)
                                  .frame(width: 62, height: 62)
                                  .flightyGlass(in: Circle(), fallback: Color(white: 0.97))
                          }
                      }
                      .padding(.horizontal, 18)
                      .padding(.bottom, 18)
                  }
                  .frame(maxWidth: .infinity, maxHeight: .infinity)
                  .background(Color.white)
                  .ignoresSafeArea(edges: .bottom)
                  .persistentSystemOverlays(.hidden)
                  .sheet(isPresented: $showSearch) {
                      FlightySearchView()
                          .presentationDetents([.large])
                          .presentationDragIndicator(.visible)
                  }
              }
          }

          // MARK: - 6. Main App Entry

          @main
          struct GlobeApp: App {
              @State private var showSheet = true
              @State private var sheetDetent: PresentationDetent = .height(272)

              private let darkGlass = Color(red: 0.10, green: 0.14, blue: 0.20).opacity(0.85)

              var body: some Scene {
                  WindowGroup {
                      ZStack(alignment: .topTrailing) {
                          Map()
                              .mapStyle(.hybrid(elevation: .realistic))
                              .ignoresSafeArea()

                          // Top-right floating controls
                          VStack(spacing: 8) {
                              VStack(spacing: 0) {
                                  Button(action: {}) {
                                      Image(systemName: "map.fill")
                                          .font(.system(size: 18, weight: .medium))
                                          .foregroundColor(.white)
                                          .frame(width: 43, height: 40)
                                  }
                                  Button(action: {}) {
                                      Image(systemName: "cloud")
                                          .font(.system(size: 18, weight: .medium))
                                          .foregroundColor(.white)
                                          .frame(width: 43, height: 40)
                                  }
                              }
                              .padding(.vertical, 2)
                              .flightyGlass(in: Capsule(), fallback: darkGlass)

                              Button(action: {}) {
                                  FlightyATCTowerIcon()
                                      .frame(width: 43, height: 43)
                                      .flightyGlass(in: Circle(), fallback: darkGlass)
                              }
                          }
                          .environment(\.colorScheme, .dark)
                          .padding(.top, 22)
                          .padding(.trailing, 16)
                      }
                      .persistentSystemOverlays(.hidden)
                      .sheet(isPresented: $showSheet) {
                          FlightySheetView()
                              .presentationDetents(
                                  [.height(272), .fraction(0.6), .large],
                                  selection: $sheetDetent
                              )
                              .interactiveDismissDisabled(true)
                              .presentationDragIndicator(.hidden)
                              .presentationBackgroundInteraction(.enabled(upThrough: .fraction(0.6)))
                              .presentationCornerRadius(42)
                              .presentationBackground(Color.white)
                      }
                  }
              }
          }
          EOF

      - name: Create Info.plist
        run: |
          cat << 'EOF' > Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>GlobeApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.custom.globe</string>
              <key>CFBundleName</key>
              <string>Flighty</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>17.0</string>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Compile App Binary
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc -sdk "$SDK_PATH" -target arm64-apple-ios17.0 -parse-as-library -framework SwiftUI -framework MapKit -framework UIKit App.swift -o GlobeApp

      - name: Package into IPA
        run: |
          mkdir -p Payload/GlobeApp.app
          cp GlobeApp Payload/GlobeApp.app/
          cp Info.plist Payload/GlobeApp.app/
          zip -r Globe.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Globe-IPA
          path: Globe.ipa

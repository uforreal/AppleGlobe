                              Text(friend.time)
                                  .font(.system(size: 13))
                                  .foregroundColor(Color(white: 0.56))
                          }
                          Text(friend.messages.last?.text ?? "")
                              .font(.system(size: 14))
                              .foregroundColor(Color(white: 0.56))
                              .lineLimit(2)
                      }
                  }
                  .padding(.vertical, 10)
                  .contentShape(Rectangle())
              }
          }

          // MARK: - 4. 1-on-1 Chat View

          struct ChatDetailView: View {
              @Binding var friend: FriendChat
              let onBack: () -> Void

              @State private var draft = ""
              @FocusState private var inputFocused: Bool

              var body: some View {
                  VStack(spacing: 0) {

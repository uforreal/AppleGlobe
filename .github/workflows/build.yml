name: Build Globe IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Create Swift App Code
        run: |
          cat << 'EOF' > App.swift
          import SwiftUI
          import MapKit

          struct FlightCardView: View {
              var body: some View {
                  VStack(alignment: .leading, spacing: 18) {
                      // Glance preview (always visible in collapsed mode)
                      HStack {
                          VStack(alignment: .leading, spacing: 4) {
                              Text("FLIGHT AF 022")
                                  .font(.caption2)
                                  .fontWeight(.bold)
                                  .foregroundColor(.secondary)
                              Text("CDG → JFK")
                                  .font(.title2)
                                  .fontWeight(.black)
                          }
                          Spacer()
                          Text("ON TIME")
                              .font(.caption)
                              .fontWeight(.bold)
                              .padding(.horizontal, 10)
                              .padding(.vertical, 5)
                              .background(Color.green.opacity(0.2))
                              .foregroundColor(.green)
                              .clipShape(Capsule())
                      }
                      .padding(.top, 8)

                      Divider()

                      // Extended flight data (revealed when pulled up)
                      HStack(spacing: 24) {
                          VStack(alignment: .leading) {
                              Text("Gate").font(.caption).foregroundColor(.secondary)
                              Text("2E").font(.headline).fontWeight(.bold)
                          }
                          VStack(alignment: .leading) {
                              Text("Altitude").font(.caption).foregroundColor(.secondary)
                              Text("38,000 ft").font(.headline).fontWeight(.bold)
                          }
                          VStack(alignment: .leading) {
                              Text("Speed").font(.caption).foregroundColor(.secondary)
                              Text("560 mph").font(.headline).fontWeight(.bold)
                          }
                          VStack(alignment: .leading) {
                              Text("Aircraft").font(.caption).foregroundColor(.secondary)
                              Text("A350-900").font(.headline).fontWeight(.bold)
                          }
                      }

                      Spacer()
                  }
                  .padding(.horizontal, 20)
              }
          }

          @main
          struct GlobeApp: App {
              @State private var showSheet = true

              var body: some Scene {
                  WindowGroup {
                      ZStack(alignment: .bottom) {
                          // 1. The 3D Interactive Apple Globe
                          Map()
                              .mapStyle(.imagery(elevation: .realistic))
                              .ignoresSafeArea()

                          // 2. The Floating Frosted-Glass Dock
                          HStack(spacing: 34) {
                              Button(action: {}) {
                                  Image(systemName: "airplane")
                                      .font(.title3)
                                      .foregroundColor(.white)
                              }
                              Button(action: {}) {
                                  Image(systemName: "globe.americas.fill")
                                      .font(.title3)
                                      .foregroundColor(.cyan)
                              }
                              Button(action: {}) {
                                  Image(systemName: "chart.bar.fill")
                                      .font(.title3)
                                      .foregroundColor(.white)
                              }
                              Button(action: {}) {
                                  Image(systemName: "person.fill")
                                      .font(.title3)
                                      .foregroundColor(.white)
                              }
                          }
                          .padding(.horizontal, 24)
                          .padding(.vertical, 14)
                          // Native Apple frosted-glass shader
                          .background(.ultraThinMaterial, in: Capsule())
                          .overlay(Capsule().stroke(.white.opacity(0.2), lineWidth: 1))
                          .shadow(color: .black.opacity(0.35), radius: 12, y: 6)
                          .padding(.bottom, 135) // Sits above the resting card
                      }
                      // 3. Apple Maps / Flighty Bottom Sheet
                      .sheet(isPresented: $showSheet) {
                          FlightCardView()
                              // 3 snap heights: peek, half screen, near full
                              .presentationDetents([.height(115), .medium, .fraction(0.85)])
                              .presentationDragIndicator(.visible)
                              // Crucial: lets you spin the Earth while sheet is visible
                              .presentationBackgroundInteraction(.enabled(upThrough: .medium))
                              .presentationCornerRadius(28)
                      }
                  }
              }
          }
          EOF

      - name: Create Info.plist
        run: |
          cat << 'EOF' > Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>GlobeApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.custom.globe</string>
              <key>CFBundleName</key>
              <string>Globe</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>17.0</string>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Compile App Binary
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc -sdk "$SDK_PATH" -target arm64-apple-ios17.0 -parse-as-library -framework SwiftUI -framework MapKit -framework UIKit App.swift -o GlobeApp

      - name: Package into IPA
        run: |
          mkdir -p Payload/GlobeApp.app
          cp GlobeApp Payload/GlobeApp.app/
          cp Info.plist Payload/GlobeApp.app/
          zip -r Globe.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Globe-IPA
          path: Globe.ipa

name: Build Globe IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Create Swift App Code
        run: |
          cat << 'EOF' > App.swift
          import SwiftUI
          import MapKit
          import UIKit
          import AVFoundation
          import PhotosUI

          // MARK: - 0. Helpers & Models

          extension View {
              /// Liquid Glass effect with fallback
              @ViewBuilder
              func flightyGlass<S: Shape>(in shape: S, fallback: Color) -> some View {
                  #if compiler(>=6.2)
                  if #available(iOS 26.0, *) {
                      self.glassEffect(.regular, in: shape)
                  } else {
                      self.background(fallback, in: shape)
                          .shadow(color: .black.opacity(0.10), radius: 6, y: 2)
                  }
                  #else
                  self.background(fallback, in: shape)
                      .shadow(color: .black.opacity(0.10), radius: 6, y: 2)
                  #endif
              }
          }

          enum MainTab {
              case world, friends, pins

              var title: String {
                  switch self {
                  case .world: return "World"
                  case .friends: return "Friends"
                  case .pins: return "Pins"
                  }
              }
          }

          enum MapStyleKind {
              case standard, satellite
          }

          enum MapLayerKind: String, CaseIterable, Identifiable {
              case flights = "Flights"
              case delays = "Delays"
              case friends = "Friends"
              var id: String { rawValue }
          }

          enum ChatFilter {
              case all, today
          }

          enum ComposerViewMode {
              case editor, gallery, camera
          }

          struct FeedPost: Identifiable {
              let id = UUID()
              let name: String
              let handle: String
              let time: String
              let color: Color
              let text: String
              let gradient: [Color]?
              let replies: String
              let reposts: String
              var likesText: String
              var numericLikes: Int?
              var isLiked: Bool = false
          }

          struct ChatMessage: Identifiable {
              let id = UUID()
              let isMe: Bool
              let text: String
          }

          struct FriendChat: Identifiable {
              let id = UUID()
              let name: String
              let color: Color
              let time: String
              var unread: Bool
              let countries: Int
              var messages: [ChatMessage]
          }

          enum AttachmentKind {
              case image(uiImage: UIImage?, gradient: [Color])
              case voice(bars: [CGFloat], duration: TimeInterval, url: URL?)
          }

          struct AttachmentItem: Identifiable {
              let id = UUID()
              let kind: AttachmentKind
          }

